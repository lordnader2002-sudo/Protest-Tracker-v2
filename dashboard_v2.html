const Sparkline=({data,color,w=80,h=28})=>{
  if(!data||data.length<2) return null;
  const max=Math.max(...data),min=Math.min(...data),r=max-min||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-2-((v-min)/r)*(h-6)}`).join(' ');
  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{display:'block'}}>
    <polygon points={`${pts} ${w},${h} 0,${h}`} fill={`${color}30`}/>
    <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>;
};

/* ═══ DATA LOADER ══════════════════════════════════════════════ */
function useData(){
  const [data,setData]=useState(null);
  const [err,setErr]=useState(null);
  useEffect(()=>{
    fetch('dashboard_data.json').then(r=>{
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }).then(d=>setData(d)).catch(e=>setErr(e.message));
  },[]);
  return {data,err};
}

function parseIso(s){if(!s) return 0;const t=new Date(s).getTime();return isNaN(t)?0:t;}
function relTime(iso){
  const t=parseIso(iso);if(!t) return '';
  const ms=Date.now()-t;if(ms<0) return 'just now';
  const m=Math.floor(ms/60000),h=Math.floor(ms/3600000),d=Math.floor(ms/86400000);
  if(m<1) return 'just now';
  if(m<60) return `${m}m ago`;
  if(h<24) return `${h}h ago`;
  if(d<7)  return `${d}d ago`;
  return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
const NEW_CUTOFF_MS=Date.now()-24*3600*1000;
function isNewRow(r){
  return (r.is_new||'').toLowerCase()==='yes'
      || parseIso(r.first_seen_iso)>NEW_CUTOFF_MS;
}

function deriveStats(data){
  if(!data) return null;
  const gen=data.general?.rows||[], nk=data.no_kings?.rows||[], md=data.may_day?.rows||[];
  const all=[...gen,...nk,...md];
  const newCount=all.filter(isNewRow).length;
  const dupCount=all.filter(r=>(r.is_duplicate||'').toLowerCase()==='yes').length;
  const recCount=all.filter(r=>(r.is_recurring||'').toLowerCase()==='yes').length;

  // Event types
  const typeMap={};
  all.forEach(r=>{const t=r.event_type||'Unknown';typeMap[t]=(typeMap[t]||0)+1;});
  const types=Object.entries(typeMap).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);

  // Top properties
  const propMap={};
  all.forEach(r=>{const p=r.property_name||'Unknown';propMap[p]=(propMap[p]||0)+1;});
  const props=Object.entries(propMap).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count).slice(0,10);

  // Proximity bands
  const bands={red:0,amber:0,green:0};
  gen.forEach(r=>{const d=parseFloat(r.distance_mi)||99;if(d<1)bands.red++;else if(d<2)bands.amber++;else bands.green++;});
  const bandsNK={red:0,amber:0,green:0};
  nk.forEach(r=>{const d=parseFloat(r.distance_mi)||99;if(d<1)bandsNK.red++;else if(d<2)bandsNK.amber++;else bandsNK.green++;});
  const bandsMD={red:0,amber:0,green:0};
  md.forEach(r=>{const d=parseFloat(r.distance_mi)||99;if(d<1)bandsMD.red++;else if(d<2)bandsMD.amber++;else bandsMD.green++;});

  // Within ½ Mile — highest priority list
  const halfMile=all.filter(r=>(parseFloat(r.distance_mi)||99)<0.5)
    .sort((a,b)=>(parseFloat(a.distance_mi)||99)-(parseFloat(b.distance_mi)||99));

  // Threat level
  const closeCount=all.filter(r=>(parseFloat(r.distance_mi)||99)<0.5).length;
  const threat=closeCount>=5?'critical':closeCount>=3?'high':closeCount>=1?'medium':'low';

  // Map markers
  const markers=[];
  const seen=new Set();
  all.forEach(r=>{
    const lat=parseFloat(r.event_lat),lon=parseFloat(r.event_lon);
    if(!lat||!lon) return;
    const key=`${lat.toFixed(3)},${lon.toFixed(3)}`;
    if(seen.has(key)){
      const m=markers.find(x=>x.key===key);
      if(m) m.count++;
      return;
    }
    seen.add(key);
    const dist=parseFloat(r.distance_mi)||99;
    markers.push({key,lat,lon,name:r.event_title,type:r.event_type,
      threat:dist<1?'critical':dist<2?'high':'low',count:1,dist});
  });

  // Organizers
  const orgMap={};
  all.forEach(r=>{const s=r.sponsor_name;if(!s)return;if(!orgMap[s])orgMap[s]={count:0,types:new Set()};orgMap[s].count++;orgMap[s].types.add(r.event_type||'');});
  const orgs=Object.entries(orgMap).map(([name,v])=>({name,count:v.count,types:[...v.types].filter(Boolean).join(', ')})).sort((a,b)=>b.count-a.count);

  return {general:gen.length,noKings:nk.length,mayDay:md.length,newCount,dupCount,recCount,
    types,props,bands,bandsNK,bandsMD,threat,closeCount,markers,orgs,halfMile,
    generated:data.generated||'',genSubtitle:data.general?.subtitle||'',
    nkSubtitle:data.no_kings?.subtitle||'',mdSubtitle:data.may_day?.subtitle||''};
}

function buildCSV(data){
  const CSV_FIELDS=[
    'event_id','event_title','event_type','event_date','event_url',
    'property_name','distance_mi','address','city','state','zip',
    'sponsor_name','sponsor_email','sponsor_phone','sponsor_website',
    'rsvp_count','is_new','is_duplicate','is_recurring',
    'event_lat','event_lon','first_seen_iso','stream'
  ];
  const escape=v=>{
    if(v==null) return '';
    const s=String(v);
    return s.includes(',')||s.includes('"')||s.includes('\n')?`"${s.replace(/"/g,'""')}"`:s;
  };
  const rows=[
    ...(data?.general?.rows||[]).map(r=>({...r,stream:'3-day'})),
    ...(data?.no_kings?.rows||[]).map(r=>({...r,stream:'no_kings'})),
    ...(data?.may_day?.rows||[]).map(r=>({...r,stream:'may_day'})),
  ];
  const header=CSV_FIELDS.join(',');
  const body=rows.map(r=>CSV_FIELDS.map(f=>escape(r[f])).join(',')).join('\n');
  const blob=new Blob([header+'\n'+body],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`protest_tracker_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
}

          return <div key={g.label} style={{marginBottom:12}}>
            <div style={{fontSize:10,fontWeight:700,color:t.textSub,marginBottom:6,textTransform:'uppercase',letterSpacing:'.06em'}}>{g.label}</div>
            {[{label:'< 1 mi',val:g.b.red,color:t.critical},{label:'1-2 mi',val:g.b.amber,color:t.high},{label:'> 2 mi',val:g.b.green,color:t.low}].map(row=>
              <div key={row.label} style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                <span style={{fontSize:11,color:t.textSub,width:42,flexShrink:0}}>{row.label}</span>
                <div style={{flex:1,height:8,background:`${t.border}`,borderRadius:3,overflow:'hidden'}}>
                  <div style={{width:`${(row.val/total)*100}%`,height:'100%',background:row.color,borderRadius:3,transition:'width .5s'}}/>
                </div>
                <span style={{...mono,fontSize:11,fontWeight:700,color:t.text,width:22,textAlign:'right'}}>{row.val}</span>
              </div>
            )}
          </div>;
        })}
      </div>

      {/* Top Properties */}
      <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:4,padding:16}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',color:t.textMuted,marginBottom:14}}>Top Exposed Properties</div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {stats.props.slice(0,8).map(p=><div key={p.name}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <span style={{fontSize:12,color:t.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:160}}>{p.name}</span>
              <span style={{...mono,fontSize:11,fontWeight:600,color:t.text}}>{p.count}</span>
            </div>
            <MiniBar value={p.count} max={maxProp} color={t.accent} t={t}/>
          </div>)}
        </div>
      </div>

      {/* Event Types */}
      <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:4,padding:16}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',color:t.textMuted,marginBottom:14}}>Event Types</div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {stats.types.slice(0,8).map((c,i)=><div key={c.name}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <span style={{fontSize:12,color:t.text}}>{c.name}</span>
              <span style={{...mono,fontSize:11,fontWeight:600,color:t.text}}>{c.count}</span>
            </div>
            <MiniBar value={c.count} max={maxType} color={typeColors[i%typeColors.length]} t={t}/>
          </div>)}
        </div>
      </div>
    </div>

    {/* Two-column row: Within ½ Mile + New Events (last 24h) */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
      {/* Within ½ Mile */}
      <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:4,padding:16}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',color:t.textMuted,marginBottom:12,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span>Within ½ Mile</span>
          <span style={{...mono,fontSize:10,color:t.critical,fontWeight:700}}>{stats.halfMile.length}</span>
        </div>
        {(()=>{
          const rows=stats.halfMile.slice(0,15);
          if(!rows.length) return <div style={{fontSize:12,color:t.textMuted,textAlign:'center',padding:16}}>No events within ½ mile</div>;
          return rows.map((ev,i)=>{
            const dist=parseFloat(ev.distance_mi)||99;
            return <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 0',
              borderBottom:i<rows.length-1?`1px solid ${t.border}`:'none'}}>
              <span style={{...mono,fontSize:12,fontWeight:700,color:t.critical,width:48,flexShrink:0}}>{dist.toFixed(2)}mi</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,color:t.text,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.event_title}</div>
                <div style={{fontSize:11,color:t.textSub,marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.property_name}</div>
              </div>
              <span style={{...mono,fontSize:12,fontWeight:600,color:t.text,flexShrink:0,whiteSpace:'nowrap'}}>{ev.event_date}</span>
            </div>;
          });
        })()}
      </div>

      {/* New Events (last 24h) */}
      <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:4,padding:16}}>
        <div style={{fontSize:9,fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',color:t.textMuted,marginBottom:12,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span>New Events · Last 24h</span>
          <span style={{...mono,fontSize:10,color:t.low,fontWeight:700}}>{stats.newCount}</span>
        </div>
        {(()=>{
          const allRows=[...(data?.general?.rows||[]),...(data?.no_kings?.rows||[]),...(data?.may_day?.rows||[])];
          const newEvts=allRows
            .filter(isNewRow)
            .sort((a,b)=>parseIso(b.first_seen_iso)-parseIso(a.first_seen_iso))
            .slice(0,15);
          if(!newEvts.length) return <div style={{fontSize:12,color:t.textMuted,textAlign:'center',padding:16}}>No new events in last 24h</div>;
          return newEvts.map((ev,i)=>{
            const dist=parseFloat(ev.distance_mi)||99;
            const c=dist<1?t.critical:dist<2?t.high:t.low;
            const rel=relTime(ev.first_seen_iso);
            return <div key={i} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'8px 0',
              borderBottom:i<newEvts.length-1?`1px solid ${t.border}`:'none'}}>
              <span style={{...mono,fontSize:9,fontWeight:600,padding:'2px 7px',borderRadius:2,flexShrink:0,marginTop:1,
                background:`${c}12`,color:c,border:`1px solid ${c}25`,textTransform:'uppercase'}}>{ev.event_type||'EVENT'}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,color:t.text,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.event_title}</div>
                <div style={{fontSize:10,color:t.textMuted,marginTop:2,display:'flex',gap:6,alignItems:'center'}}>
                  <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',minWidth:0}}>{ev.property_name} · {(dist).toFixed(1)} mi</span>
                  {rel&&<span style={{...mono,color:t.low,fontWeight:700,flexShrink:0}}>• {rel}</span>}
                </div>
              </div>
              <span style={{...mono,fontSize:12,fontWeight:600,color:t.text,flexShrink:0,whiteSpace:'nowrap'}}>{ev.event_date}</span>
            </div>;
          });
        })()}
      </div>
    </div>
  </div>;
};

/* ═══ EVENT MODAL ══════════════════════════════════════════════ */
const EventModal=({t,ev,onClose})=>{
  useEffect(()=>{
    if(!ev) return;
    const onKey=e=>{if(e.key==='Escape') onClose();};
    window.addEventListener('keydown',onKey);
    const prev=document.body.style.overflow;
    document.body.style.overflow='hidden';
    return ()=>{window.removeEventListener('keydown',onKey);document.body.style.overflow=prev;};
  },[ev,onClose]);
  if(!ev) return null;
  const dist=parseFloat(ev.distance_mi)||99;
  const distColor=dist<1?t.critical:dist<2?t.high:t.low;
  const fmtTs=iso=>{try{return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});}catch{return iso;}};
  const copyUrl=()=>{if(!ev.event_url)return;navigator.clipboard?.writeText(ev.event_url);};
  const slots=Array.isArray(ev.all_timeslots)?ev.all_timeslots:[];
  const tags=Array.isArray(ev.tags)?ev.tags:[];

  return <div onClick={onClose} style={{
    position:'fixed',inset:0,background:'rgba(0,0,0,.62)',backdropFilter:'blur(3px)',
    display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:24}}>
    <div onClick={e=>e.stopPropagation()} style={{
      background:t.surface,border:`1px solid ${t.border}`,borderRadius:6,
      maxWidth:720,width:'100%',maxHeight:'90vh',overflowY:'auto',
      boxShadow:'0 20px 60px rgba(0,0,0,.5)',position:'relative'}}>
      {/* Hero */}
      {ev.featured_image_url&&<div style={{
        height:180,backgroundImage:`url(${ev.featured_image_url})`,
        backgroundSize:'cover',backgroundPosition:'center',
        borderBottom:`1px solid ${t.border}`,position:'relative'}}>
        <div style={{position:'absolute',inset:0,background:`linear-gradient(to bottom, transparent 40%, ${t.surface})`,pointerEvents:'none'}}/>
      </div>}
      {/* Header */}
      <div style={{padding:'18px 22px 14px',borderBottom:`1px solid ${t.border}`,position:'relative'}}>
        <button onClick={onClose} title="Close (Esc)" style={{
          position:'absolute',top:12,right:12,background:'transparent',
          border:`1px solid ${t.border}`,color:t.textSub,width:28,height:28,
          borderRadius:4,cursor:'pointer',fontSize:16,lineHeight:1,display:'flex',
          alignItems:'center',justifyContent:'center'}}>×</button>
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:6,flexWrap:'wrap'}}>
          <span style={{...mono,fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:2,
            background:`${t.accent}18`,color:t.accent,border:`1px solid ${t.accent}35`,textTransform:'uppercase',letterSpacing:'.06em'}}>{ev.event_type||'Event'}</span>
          <span style={{...mono,fontSize:10,fontWeight:700,padding:'3px 8px',borderRadius:2,
            background:`${distColor}18`,color:distColor,border:`1px solid ${distColor}35`}}>{dist.toFixed(2)} mi</span>
          {ev.is_virtual&&<span style={{...mono,fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:2,
            background:`${t.textMuted}18`,color:t.textSub,border:`1px solid ${t.border}`,textTransform:'uppercase',letterSpacing:'.06em'}}>Virtual</span>}
        </div>
        <h2 style={{fontSize:18,fontWeight:700,color:t.text,marginRight:32,lineHeight:1.3}}>{ev.event_title||'Untitled'}</h2>
        <p style={{fontSize:11,color:t.textMuted,marginTop:4}}>Near <span style={{color:t.text,fontWeight:600}}>{ev.property_name}</span></p>
      </div>
      {/* Meta grid */}
      <div style={{padding:'14px 22px',borderBottom:`1px solid ${t.border}`,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div>
          <div style={{...mono,fontSize:9,fontWeight:700,color:t.textMuted,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:3}}>Date / Time</div>
          <div style={{fontSize:12,color:t.text}}>{ev.event_date||'—'}</div>
        </div>
        <div>
          <div style={{...mono,fontSize:9,fontWeight:700,color:t.textMuted,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:3}}>Location</div>
          <div style={{fontSize:12,color:t.text,wordBreak:'break-word'}}>{ev.event_location||'—'}</div>
        </div>
        {(ev.rsvp_count>0)&&<div>
          <div style={{...mono,fontSize:9,fontWeight:700,color:t.textMuted,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:3}}>RSVPs</div>
          <div style={{...mono,fontSize:16,fontWeight:700,color:dist<1?t.critical:dist<2?t.high:t.low}}>{ev.rsvp_count.toLocaleString()}</div>
        </div>}
      </div>
      {/* Sponsor */}
      {(ev.sponsor_name||ev.sponsor_email||ev.sponsor_phone||ev.sponsor_website)&&<div style={{padding:'14px 22px',borderBottom:`1px solid ${t.border}`}}>
        <div style={{...mono,fontSize:9,fontWeight:700,color:t.textMuted,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6}}>Sponsor / Organizer</div>
        <div style={{fontSize:13,color:t.text,fontWeight:600,marginBottom:4}}>{ev.sponsor_name||'Unknown'}</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:12,fontSize:11}}>
          {ev.sponsor_email&&<a href={`mailto:${ev.sponsor_email}`} style={{color:t.accent,textDecoration:'none'}}>✉ {ev.sponsor_email}</a>}
          {ev.sponsor_phone&&<a href={`tel:${ev.sponsor_phone}`} style={{color:t.accent,textDecoration:'none'}}>☎ {ev.sponsor_phone}</a>}
          {ev.sponsor_website&&<a href={ev.sponsor_website} target="_blank" rel="noopener" style={{color:t.accent,textDecoration:'none'}}>🔗 Website</a>}
        </div>
      </div>}
      {/* Description */}
      {ev.description&&<div style={{padding:'14px 22px',borderBottom:`1px solid ${t.border}`}}>
        <div style={{...mono,fontSize:9,fontWeight:700,color:t.textMuted,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6}}>Description</div>
        <div style={{fontSize:12,color:t.text,lineHeight:1.55,whiteSpace:'pre-wrap',maxHeight:240,overflowY:'auto'}}>{ev.description}</div>
      </div>}
      {/* All timeslots */}
      {slots.length>1&&<div style={{padding:'14px 22px',borderBottom:`1px solid ${t.border}`}}>
        <div style={{...mono,fontSize:9,fontWeight:700,color:t.textMuted,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6}}>All Timeslots ({slots.length})</div>
        <div style={{maxHeight:160,overflowY:'auto'}}>
          {slots.map((ts,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',
            padding:'4px 0',borderBottom:i<slots.length-1?`1px solid ${t.border}`:'none'}}>
            <span style={{...mono,fontSize:11,color:t.text}}>{fmtTs(ts.start_iso)}</span>
            {ts.rsvps>0&&<span style={{...mono,fontSize:10,fontWeight:700,color:t.textSub}}>{ts.rsvps.toLocaleString()} RSVPs</span>}
          </div>)}
        </div>
      </div>}
      {/* Tags */}
      {tags.length>0&&<div style={{padding:'14px 22px',borderBottom:`1px solid ${t.border}`}}>
        <div style={{...mono,fontSize:9,fontWeight:700,color:t.textMuted,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6}}>Tags</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {tags.map((tag,i)=><span key={i} style={{...mono,fontSize:10,padding:'3px 8px',borderRadius:2,
            background:t.border,color:t.textSub,border:`1px solid ${t.borderStrong||t.border}`}}>{tag}</span>)}
        </div>
      </div>}
      {/* Accessibility */}
      {ev.accessibility_notes&&<div style={{padding:'14px 22px',borderBottom:`1px solid ${t.border}`}}>
        <div style={{...mono,fontSize:9,fontWeight:700,color:t.textMuted,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6}}>Accessibility</div>
        <div style={{fontSize:11,color:t.textSub,lineHeight:1.5}}>{ev.accessibility_notes}</div>
      </div>}
      {/* Flags */}
      {((ev.is_new||'').toLowerCase()==='yes'||(ev.is_duplicate||'').toLowerCase()==='yes'||(ev.is_recurring||'').toLowerCase()==='yes')&&
      <div style={{padding:'14px 22px',borderBottom:`1px solid ${t.border}`,display:'flex',gap:8,flexWrap:'wrap'}}>
        {(ev.is_new||'').toLowerCase()==='yes'&&<span style={{...mono,fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:2,background:`${t.low}18`,color:t.low,border:`1px solid ${t.low}35`,textTransform:'uppercase',letterSpacing:'.06em'}}>New · &lt;24h</span>}
        {(ev.is_duplicate||'').toLowerCase()==='yes'&&<span style={{...mono,fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:2,background:`${t.high}18`,color:t.high,border:`1px solid ${t.high}35`,textTransform:'uppercase',letterSpacing:'.06em'}}>Near 2+ Properties</span>}
        {(ev.is_recurring||'').toLowerCase()==='yes'&&<span style={{...mono,fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:2,background:`${t.accent}18`,color:t.accent,border:`1px solid ${t.accent}35`,textTransform:'uppercase',letterSpacing:'.06em'}}>Recurring</span>}
      </div>}
      {/* Actions */}
      <div style={{padding:'14px 22px',display:'flex',gap:8,justifyContent:'flex-end'}}>
        <button onClick={copyUrl} disabled={!ev.event_url} style={{
          background:'transparent',border:`1px solid ${t.border}`,color:t.textSub,
          padding:'7px 14px',borderRadius:4,cursor:ev.event_url?'pointer':'not-allowed',
          fontSize:11,...mono,letterSpacing:'.06em',textTransform:'uppercase',
          opacity:ev.event_url?1:.5}}>Copy URL</button>
        {ev.event_url&&<a href={ev.event_url} target="_blank" rel="noopener" style={{
          background:t.accent,border:`1px solid ${t.accent}`,color:'#fff',
          padding:'7px 14px',borderRadius:4,textDecoration:'none',
          fontSize:11,...mono,letterSpacing:'.06em',textTransform:'uppercase'}}>Open on Mobilize →</a>}
      </div>
    </div>
  </div>;
};

/* ═══ EVENTS TABLE ═════════════════════════════════════════════ */
const EventsTable=({t,rows,type,subtitle})=>{
  const [sortCol,setSortCol]=useState('distance_mi');
  const [sortDir,setSortDir]=useState('asc');
  const [search,setSearch]=useState('');
  const [hovered,setHovered]=useState(null);
  const [selected,setSelected]=useState(null);

  const data=useMemo(()=>{
    return (rows||[])
      .filter(r=>{
        if(!search) return true;
        const s=search.toLowerCase();
        return (r.event_title||'').toLowerCase().includes(s)||
          (r.property_name||'').toLowerCase().includes(s)||
          (r.event_location||'').toLowerCase().includes(s)||
          (r.event_type||'').toLowerCase().includes(s);
      })
      .sort((a,b)=>{
        let va=a[sortCol]??'',vb=b[sortCol]??'';
        if(sortCol==='distance_mi'){va=parseFloat(va)||0;vb=parseFloat(vb)||0;}
        else{va=String(va).toLowerCase();vb=String(vb).toLowerCase();}
        if(va<vb) return sortDir==='asc'?-1:1;
        if(va>vb) return sortDir==='asc'?1:-1;
        return 0;
      });
  },[rows,search,sortCol,sortDir]);

  const sort=col=>{if(sortCol===col)setSortDir(d=>d==='asc'?'desc':'asc');else{setSortCol(col);setSortDir('asc');}};

  const TH=({col,children,right})=><th onClick={()=>sort(col)} style={{
    padding:'8px 12px',textAlign:right?'right':'left',fontSize:9,fontWeight:700,letterSpacing:'.1em',
    textTransform:'uppercase',color:sortCol===col?t.accent:t.textMuted,
    borderBottom:`2px solid ${sortCol===col?t.accent:t.border}`,cursor:'pointer',userSelect:'none',
    whiteSpace:'nowrap',background:`${t.border}44`,position:'sticky',top:0,zIndex:2}}>
    <span style={{display:'inline-flex',alignItems:'center',gap:4}}>{children}
      {sortCol===col&&<span style={{fontSize:10}}>{sortDir==='desc'?'↓':'↑'}</span>}
    </span>
  </th>;

  const tdBase={padding:'10px 12px',borderBottom:`1px solid ${t.border}`,verticalAlign:'top',fontSize:12,color:t.text};
  const flagCell=(val)=>{
    const yes=(val||'').toLowerCase()==='yes';
    return <span style={{...mono,fontSize:9,fontWeight:700,color:yes?t.low:t.textMuted,
      background:yes?`${t.low}15`:'transparent',padding:'2px 6px',borderRadius:2}}>{yes?'YES':'—'}</span>;
  };

  return <div style={{padding:22}}>
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
      <div style={{display:'flex',alignItems:'center',gap:8,background:t.surface,border:`1px solid ${t.border}`,
        borderRadius:4,padding:'6px 12px'}}>
        <Icon id="search" size={13} color={t.textMuted}/>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search events, properties…"
          style={{border:'none',outline:'none',fontSize:12,background:'transparent',color:t.text,width:220}}/>
      </div>
    </div>
    <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:4,overflow:'hidden'}}>
      <div style={{overflowX:'auto',maxHeight:'calc(100vh - 220px)',overflowY:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr>
            <TH col="property_name">Property</TH>
            <TH col="event_title">Event</TH>
            <TH col="event_type">Type</TH>
            <TH col="event_date">Date / Time</TH>
            <TH col="event_location">Location</TH>
            <TH col="distance_mi" right>Distance</TH>
            <TH col="is_new">New</TH>
            <TH col="is_duplicate">Dup</TH>
            <TH col="is_recurring">Recur</TH>
          </tr></thead>
          <tbody>
            {data.map((ev,i)=>{
              const dist=parseFloat(ev.distance_mi)||99;
              const bandBg=dist<1?`${t.critical}28`:dist<2?`${t.high}1a`:'transparent';
              const isNew=(ev.is_new||'').toLowerCase()==='yes';
              return <tr key={i}
                onMouseEnter={()=>setHovered(i)} onMouseLeave={()=>setHovered(null)}
                onClick={()=>setSelected(ev)}
                style={{background:hovered===i?`${t.accent}0a`:bandBg,transition:'background .1s',fontWeight:isNew?600:400,cursor:'pointer'}}>
                <td style={{...tdBase,fontWeight:500,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.property_name}</td>
                <td style={{...tdBase,maxWidth:220}}>
                  <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.event_title}</div>
                  {ev.event_url&&<a href={ev.event_url} target="_blank" rel="noopener" style={{fontSize:10,color:t.accent}}>link</a>}
                </td>
                <td style={{...tdBase,fontSize:11}}>{ev.event_type}</td>
                <td style={{...tdBase,...mono,fontSize:10}}>{ev.event_date}</td>
                <td style={{...tdBase,fontSize:11,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.event_location}</td>
                <td style={{...tdBase,...mono,fontWeight:700,textAlign:'right',
                  color:dist<1?t.critical:dist<2?t.high:t.low,fontSize:13}}>{dist.toFixed(2)}</td>
                <td style={tdBase}>{flagCell(ev.is_new)}</td>
                <td style={tdBase}>{flagCell(ev.is_duplicate)}</td>
                <td style={tdBase}>{flagCell(ev.is_recurring)}</td>
              </tr>;
            })}
            {data.length===0&&<tr><td colSpan={9} style={{padding:40,textAlign:'center',color:t.textMuted,fontSize:13}}>
              {search?`No events match "${search}"`:'No events in this window'}</td></tr>}
          </tbody>
        </table>
      </div>
      <div style={{padding:'8px 14px',borderTop:`1px solid ${t.border}`,display:'flex',justifyContent:'space-between',background:`${t.border}33`}}>
        <span style={{...mono,fontSize:10,color:t.textMuted}}>{data.length} records · sorted by {sortCol} · click any row for details</span>
        <span style={{...mono,fontSize:10,color:t.textMuted}}>Distance bands: <span style={{color:t.critical}}>●</span> &lt;1mi <span style={{color:t.high}}>●</span> 1-2mi <span style={{color:t.low}}>●</span> &gt;2mi</span>
      </div>
    </div>
    <EventModal t={t} ev={selected} onClose={()=>setSelected(null)}/>
  </div>;
};

/* ═══ MAP VIEW ═════════════════════════════════════════════════ */
const MapView=({t,markers})=>{
  const mapRef=useRef(null);
  const mapInst=useRef(null);
  const [filter,setFilter]=useState('all');

  useEffect(()=>{
    if(mapInst.current){mapInst.current.remove();mapInst.current=null;}
    if(!mapRef.current||!markers) return;
    const map=L.map(mapRef.current,{zoomControl:false}).setView([38,-96],4);
    L.control.zoom({position:'topleft'}).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
      attribution:'&copy; CARTO',maxZoom:18}).addTo(map);
    const colors={critical:'#dc2626',high:'#ea580c',medium:'#b45309',low:'#15803d'};
    (markers||[]).forEach(m=>{
      if(filter!=='all'&&m.threat!==filter) return;
      const c=colors[m.threat]||'#888';
      const circle=L.circleMarker([m.lat,m.lon],{radius:6+m.count*2,fillColor:c,color:'#fff',
        weight:1.5,fillOpacity:.85,opacity:.9}).addTo(map);
      circle.bindPopup(`<div style="min-width:160px"><b>${m.name}</b><br/><span style="color:#888">${m.type||''}</span><br/><span style="font-size:10px;color:${c};font-weight:700">${m.dist.toFixed(2)} mi</span></div>`);
    });
    mapInst.current=map;
    return ()=>{if(mapInst.current){mapInst.current.remove();mapInst.current=null;}};
  },[filter,markers]);

  const colors={critical:'#dc2626',high:'#ea580c',low:'#15803d'};
  const counts={all:(markers||[]).length};
  ['critical','high','low'].forEach(lv=>{counts[lv]=(markers||[]).filter(m=>m.threat===lv).length;});

  return <div style={{height:'100%',display:'flex',flexDirection:'column'}}>
    <div style={{padding:'8px 16px',display:'flex',alignItems:'center',gap:8,
      borderBottom:`1px solid ${t.border}`,background:t.surface,flexShrink:0}}>
      <span style={{...mono,fontSize:10,color:t.textMuted,letterSpacing:'.08em',marginRight:4}}>FILTER</span>
      {['all','critical','high','low'].map(lv=><button key={lv} onClick={()=>setFilter(lv)} style={{
        ...mono,fontSize:9,fontWeight:600,letterSpacing:'.06em',padding:'4px 10px',borderRadius:3,cursor:'pointer',
        textTransform:'uppercase',transition:'all .12s',
        border:filter===lv?`1px solid ${lv==='all'?t.accent:colors[lv]}`:`1px solid ${t.border}`,
        background:filter===lv?(lv==='all'?t.accentBg:`${colors[lv]}15`):'transparent',
        color:filter===lv?(lv==='all'?t.accent:colors[lv]):t.textMuted}}>
        {lv==='all'?'All':lv==='critical'?'< 1 mi':lv==='high'?'1-2 mi':'> 2 mi'} ({counts[lv]})
      </button>)}
      <span style={{marginLeft:'auto',...mono,fontSize:10,color:t.textMuted}}>
        {counts[filter==='all'?'all':filter]} markers · Dark tiles
      </span>
    </div>
    <div ref={mapRef} style={{flex:1,minHeight:0}}/>
    <div style={{position:'absolute',bottom:16,right:16,zIndex:1000,
      background:'rgba(10,22,40,.92)',borderRadius:6,padding:'10px 14px',border:'1px solid rgba(255,255,255,.1)'}}>
      <div style={{...mono,fontSize:9,color:'#8ca3c0',letterSpacing:'.1em',marginBottom:6}}>DISTANCE</div>
      {[{lv:'critical',label:'< 1 mile'},{lv:'high',label:'1-2 miles'},{lv:'low',label:'> 2 miles'}].map(x=>
        <div key={x.lv} style={{display:'flex',alignItems:'center',gap:8,marginBottom:3}}>
          <div style={{width:10,height:10,borderRadius:'50%',background:colors[x.lv],border:'1.5px solid rgba(255,255,255,.3)'}}/>
          <span style={{...mono,fontSize:10,color:'#c8ddf5'}}>{x.label}</span>
        </div>
      )}
    </div>
  </div>;
};

/* ═══ TIMELINE ═════════════════════════════════════════════════ */
const Timeline=({t,data})=>{
  const [selected,setSelected]=useState(null);
  const STREAM_COLOR={general:t.accent,'no_kings':'#7c3aed',may_day:'#ef4444'};
  const STREAM_LABEL={general:'3-day','no_kings':'no-kings',may_day:'may-day'};

  const allRows=useMemo(()=>{
    const parseDate=str=>{try{return new Date(str.replace(/\s+EST$/,'').trim());}catch{return new Date(0);}};
    return [
      ...(data?.general?.rows||[]).map(r=>({...r,_src:'general'})),
      ...(data?.no_kings?.rows||[]).map(r=>({...r,_src:'no_kings'})),
      ...(data?.may_day?.rows||[]).map(r=>({...r,_src:'may_day'})),
    ].sort((a,b)=>parseDate(a.event_date)-parseDate(b.event_date));
  },[data]);

  const groups=useMemo(()=>{
    const dayKey=str=>{try{const d=new Date(str.replace(/\s+EST$/,'').trim());return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}catch{return str||'Unknown';}};
    const out=[];let cur=null;
    for(const row of allRows){
      const k=dayKey(row.event_date);
      if(!cur||cur.key!==k){cur={key:k,rows:[]};out.push(cur);}
      cur.rows.push(row);
    }
    return out;
  },[allRows]);

  if(!allRows.length) return <div style={{padding:60,textAlign:'center',color:t.textMuted,fontSize:13}}>No events loaded.</div>;

  return <div style={{padding:'16px 22px'}}>
    <EventModal t={t} ev={selected} onClose={()=>setSelected(null)}/>
    {groups.map((g,gi)=><div key={gi} style={{marginBottom:8}}>
      {/* Date header */}
      <div style={{display:'flex',alignItems:'center',gap:12,margin:'18px 0 10px',position:'sticky',top:0,background:t.bg,zIndex:2,padding:'4px 0'}}>
        <span style={{...mono,fontSize:11,fontWeight:700,color:t.accent,letterSpacing:'.08em',textTransform:'uppercase',flexShrink:0}}>{g.key}</span>
        <div style={{flex:1,height:1,background:t.border}}/>
        <span style={{...mono,fontSize:10,color:t.textMuted,flexShrink:0}}>{g.rows.length} event{g.rows.length!==1?'s':''}</span>
      </div>
      {/* Event cards */}
      <div style={{paddingLeft:20,borderLeft:`2px solid ${t.border}`,display:'flex',flexDirection:'column',gap:6}}>
        {g.rows.map((ev,i)=>{
          const dist=parseFloat(ev.distance_mi)||99;
          const dc=dist<1?t.critical:dist<2?t.high:t.low;
          const sc=STREAM_COLOR[ev._src]||t.accent;
          const timeMatch=ev.event_date?.match(/\d{1,2}:\d{2}/);
          return <div key={i} onClick={()=>setSelected(ev)}
            style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:4,padding:'9px 14px',
              cursor:'pointer',display:'flex',alignItems:'center',gap:12,position:'relative',
              transition:'border-color .12s'}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=t.borderStrong}
            onMouseLeave={e=>e.currentTarget.style.borderColor=t.border}>
            {/* Dot on the left rail */}
            <div style={{width:9,height:9,borderRadius:'50%',background:sc,flexShrink:0,
              position:'absolute',left:-25,top:'50%',transform:'translateY(-50%)',
              boxShadow:`0 0 0 2px ${t.bg},0 0 0 3px ${sc}55`}}/>
            {/* Time */}
            <span style={{...mono,fontSize:11,color:t.textMuted,flexShrink:0,width:60}}>
              {timeMatch?`${timeMatch[0]} ET`:'—'}
            </span>
            {/* Stream badge */}
            <span style={{...mono,fontSize:9,fontWeight:700,padding:'2px 6px',borderRadius:2,flexShrink:0,
              background:`${sc}18`,color:sc,border:`1px solid ${sc}35`,textTransform:'uppercase',letterSpacing:'.06em'}}>
              {STREAM_LABEL[ev._src]}
            </span>
            {/* Title + property */}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:t.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.event_title}</div>
              <div style={{fontSize:11,color:t.textSub,marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.property_name}</div>
            </div>
            {/* Distance */}
            <span style={{...mono,fontSize:12,fontWeight:700,color:dc,flexShrink:0}}>{dist.toFixed(1)} mi</span>
          </div>;
        })}
      </div>
    </div>)}
  </div>;
};

/* ═══ ORGANIZERS ═══════════════════════════════════════════════ */
const Organizers=({t,orgs})=>{
  const maxOrg=Math.max(...(orgs||[]).map(o=>o.count),1);
  if(!orgs||!orgs.length) return <div style={{padding:40,textAlign:'center',color:t.textMuted}}>No organizer data available</div>;
  return <div style={{padding:22}}>
    <h2 style={{fontSize:17,fontWeight:700,color:t.text,marginBottom:4}}>Event Organizers</h2>
    <p style={{fontSize:11,color:t.textMuted,marginBottom:16}}>Combined activity across 3-Day + No Kings windows · {orgs.length} organizers</p>
    <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:4,padding:16}}>
      {orgs.slice(0,30).map((o,i)=><div key={o.name} style={{display:'flex',alignItems:'center',gap:10,
        padding:'7px 0',borderBottom:i<Math.min(orgs.length,30)-1?`1px solid ${t.border}`:'none'}}>
        <span style={{...mono,fontSize:10,fontWeight:700,color:t.textMuted,width:20,textAlign:'center'}}>{i+1}</span>
        <span style={{fontSize:12,fontWeight:500,color:t.text,width:200,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{o.name}</span>
        <span style={{fontSize:10,color:t.textMuted,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{o.types}</span>
        <div style={{width:90,height:6,borderRadius:3,background:`${t.border}`,overflow:'hidden',flexShrink:0}}>
          <div style={{width:`${(o.count/maxOrg)*100}%`,height:'100%',background:t.accent,borderRadius:3}}/>
        </div>
        <span style={{...mono,fontSize:11,fontWeight:700,color:t.accent,width:22,textAlign:'right'}}>{o.count}</span>
      </div>)}
    </div>
  </div>;
};

/* ═══ TRENDS ═══════════════════════════════════════════════════ */
const Trends=({t,data})=>{
  const canvasRef=useRef(null);
  const runs=data?.trend_data?.runs||[];
  useEffect(()=>{
    if(!canvasRef.current||!runs.length) return;
    const isDarkBg=(()=>{const b=t.bg||'#fff';const m=b.match(/[0-9a-f]{2}/gi);if(!m)return false;const [r,g,bl]=m.map(x=>parseInt(x,16));return (r+g+bl)/3<128;})();
    const gridColor=isDarkBg?'rgba(255,255,255,.08)':'rgba(0,0,0,.08)';
    const labels=runs.map(r=>{try{return new Date(r.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric'});}catch{return r.timestamp||'';}});
    const chart=new Chart(canvasRef.current,{
      type:'line',
      data:{labels,datasets:[
        {label:'3-Day',data:runs.map(r=>r.gen_total??0),borderColor:t.accent,backgroundColor:`${t.accent}22`,tension:.3,fill:false},
        {label:'No Kings',data:runs.map(r=>r.nk_total??0),borderColor:'#7c3aed',backgroundColor:'#7c3aed22',tension:.3,fill:false},
        {label:'May Day',data:runs.map(r=>r.md_total??0),borderColor:'#ef4444',backgroundColor:'#ef444422',tension:.3,fill:false},
      ]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:t.text,font:{family:"'IBM Plex Sans'",size:11}}}},
        scales:{x:{ticks:{color:t.textMuted},grid:{color:gridColor}},y:{beginAtZero:true,ticks:{color:t.textMuted},grid:{color:gridColor}}},
      },
    });
    return ()=>chart.destroy();
  },[runs,t]);
  if(!runs.length) return <div style={{padding:40,textAlign:'center',color:t.textMuted,fontSize:13}}>No trend data yet · Trends populate after multiple scheduled runs</div>;
  return <div style={{padding:22}}>
    <h2 style={{fontSize:17,fontWeight:700,color:t.text,marginBottom:4}}>Event Volume Trends</h2>
    <p style={{fontSize:11,color:t.textMuted,marginBottom:16}}>Totals per run across 3-Day, No Kings, and May Day streams · {runs.length} runs tracked</p>
    <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:4,padding:20,height:'calc(100vh - 200px)',position:'relative'}}>
      <canvas ref={canvasRef}/>
    </div>
  </div>;
};

/* ═══ TWEAKS ═══════════════════════════════════════════════════ */
const TweaksPanel=({t,variant,setVariant})=><div style={{
  position:'fixed',bottom:20,right:20,width:250,background:t.surface,border:`1px solid ${t.borderStrong}`,
  borderRadius:8,padding:18,boxShadow:'0 12px 40px rgba(0,0,0,.18)',zIndex:9999}}>
  <div style={{fontSize:11,fontWeight:700,color:t.text,marginBottom:14,letterSpacing:'.06em'}}>TWEAKS</div>
  <div style={{fontSize:10,color:t.textMuted,marginBottom:10,textTransform:'uppercase',letterSpacing:'.08em'}}>Design variant</div>
  <div style={{display:'flex',gap:8}}>
    {Object.entries(THEMES).map(([k,th])=><button key={k} onClick={()=>setVariant(k)} style={{
      flex:1,padding:'10px 0',borderRadius:4,border:`2px solid ${variant===k?t.accent:t.border}`,
      background:variant===k?t.accentBg:'transparent',color:variant===k?t.accent:t.textMuted,
      fontSize:11,fontWeight:700,cursor:'pointer',letterSpacing:'.08em',transition:'all .15s'}}>{th.label}</button>)}
  </div>
</div>;

/* ═══ APP ══════════════════════════════════════════════════════ */
function applyDark(base){
  return {...base,
    bg:'#0d1117', surface:'#161b22', border:'#30363d', borderStrong:'#484f58',
    text:'#e6edf3', textSub:'#8b949e', textMuted:'#6e7681',
    critical:'#f87171', high:'#fb923c', medium:'#fbbf24', low:'#4ade80',
    accent:'#60a5fa', accentBg:'rgba(96,165,250,.12)',
  };
}

const App=()=>{
  const saved=(()=>{try{return JSON.parse(localStorage.getItem('pt2_state')||'{}')}catch{return{}}})();
  const [variant,setVariant]=useState(saved.variant||TWEAK_DEFAULTS.variant);
  const [view,setView]=useState(saved.view||'dashboard');
  const [darkMode,setDarkMode]=useState(saved.dark==='1');
  const [tweaks,setTweaks]=useState(false);
  const base=THEMES[variant]||THEMES.ops;
  const t=darkMode?applyDark(base):base;

  const {data,err}=useData();
  const stats=useMemo(()=>deriveStats(data),[data]);

  const persist=(k,v)=>{const s=JSON.parse(localStorage.getItem('pt2_state')||'{}');s[k]=v;localStorage.setItem('pt2_state',JSON.stringify(s));};
  const handleVariant=v=>{setVariant(v);persist('variant',v);window.parent.postMessage({type:'__edit_mode_set_keys',edits:{variant:v}},'*');};
  const handleView=v=>{setView(v);persist('view',v);};
  const handleDark=()=>{const nv=!darkMode;setDarkMode(nv);persist('dark',nv?'1':'0');};

  useEffect(()=>{
    const fn=e=>{
      if(e.data?.type==='__activate_edit_mode') setTweaks(true);
      if(e.data?.type==='__deactivate_edit_mode') setTweaks(false);
    };
    window.addEventListener('message',fn);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return ()=>window.removeEventListener('message',fn);
  },[]);

  if(err) return <div style={{padding:60,textAlign:'center',fontFamily:'IBM Plex Sans',color:'#666'}}>
    <h2 style={{marginBottom:12}}>Could not load dashboard_data.json</h2>
    <p>Make sure <code>dashboard_data.json</code> is in the same folder as this file.</p>
    <p style={{marginTop:8,fontSize:12,color:'#999'}}>Error: {err}</p>
    <a href="classic.html" style={{display:'inline-block',marginTop:16,color:'#2563eb'}}>← Switch to Classic Dashboard</a>
  </div>;

  return <div style={{display:'flex',height:'100vh',overflow:'hidden',background:t.bg}}>
    <Sidebar t={t} view={view} setView={handleView} generated={stats?.generated}/>
    <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
      {(()=>{
        const sub=view==='events3'?stats?.genSubtitle:view==='nogo'?stats?.nkSubtitle:view==='mayday'?stats?.mdSubtitle:'';
        const count=view==='events3'?(data?.general?.rows||[]).length:view==='nogo'?(data?.no_kings?.rows||[]).length:view==='mayday'?(data?.may_day?.rows||[]).length:null;
        return <TopBar t={t} view={view} generated={stats?.generated} darkMode={darkMode} handleDark={handleDark} subtitle={sub} count={count}/>;
      })()}
      <div style={{flex:1,overflowY:'auto',position:'relative'}}>
        {view==='dashboard'&&<Dashboard t={t} stats={stats} data={data}/>}
        {view==='events3'&&<EventsTable t={t} rows={data?.general?.rows} type="3day" subtitle={stats?.genSubtitle||''}/>}
        {view==='nogo'&&<EventsTable t={t} rows={data?.no_kings?.rows} type="nogo" subtitle={stats?.nkSubtitle||''}/>}
        {view==='mayday'&&<EventsTable t={t} rows={data?.may_day?.rows} type="mayday" subtitle={stats?.mdSubtitle||''}/>}
        {view==='map'&&<MapView t={t} markers={stats?.markers}/>}
        {view==='timeline'&&<Timeline t={t} data={data}/>}
        {view==='organizers'&&<Organizers t={t} orgs={stats?.orgs}/>}
        {view==='trends'&&<Trends t={t} data={data}/>}
      </div>
    </div>
    {tweaks&&<TweaksPanel t={t} variant={variant} setVariant={handleVariant}/>}
  </div>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
