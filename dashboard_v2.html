const Sparkline=({data,color,w=80,h=28})=>{
  if(!data||data.length<2) return null;
  const max=Math.max(...data),min=Math.min(...data),r=max-min||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-2-((v-min)/r)*(h-6)}`).join(' ');
  return <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{display:'block'}}>
    <polygon points={`${pts} ${w},${h} 0,${h}`} fill={`${color}30`}/>
    <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
  </svg>;
};

const MiniBar=({value,max,color,t})=><div style={{height:6,background:t?.border||'rgba(128,128,128,.2)',borderRadius:2}}>

const Pill=({level,t})=>{const c=threatColor(t,level);return <span style={{
  ...mono,display:'inline-block',fontSize:9,fontWeight:600,letterSpacing:'.07em',

const DistPill=({dist,t})=>{
  const lv=dist<1?'critical':dist<2?'high':'low';
  const labels={critical:'< 1 mi',high:'1-2 mi',low:'> 2 mi'};
  return <Pill level={labels[lv]||lv} t={{...t,critical:t.critical,high:t.high,low:t.low}}/>;
};

/* ═══ DATA LOADER ══════════════════════════════════════════════ */
function useData(){
  const [data,setData]=useState(null);
  const [err,setErr]=useState(null);
  useEffect(()=>{
    fetch('dashboard_data.json').then(r=>{
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }).then(d=>setData(d)).catch(e=>setErr(e.message));
  },[]);
  return {data,err};
}

function parseIso(s){if(!s) return 0;const t=new Date(s).getTime();return isNaN(t)?0:t;}
function relTime(iso){
  const t=parseIso(iso);if(!t) return '';
  const ms=Date.now()-t;if(ms<0) return 'just now';
  const m=Math.floor(ms/60000),h=Math.floor(ms/3600000),d=Math.floor(ms/86400000);
  if(m<1) return 'just now';
  if(m<60) return `${m}m ago`;
  if(h<24) return `${h}h ago`;
  if(d<7)  return `${d}d ago`;
  return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
const NEW_CUTOFF_MS=Date.now()-7*24*3600*1000;
function computeBootstrapTs(allRows){
  // If a large cohort of events share a single first_seen_iso timestamp
  // (within 60s of each other), that timestamp is a bootstrap/reseed
  // moment — not genuine discoveries. Events at that timestamp should
  // NOT be counted as "new".
  const buckets={};
  for(const r of allRows){
    const t=parseIso(r.first_seen_iso);
    if(!t) continue;
    const bucket=Math.floor(t/60000); // 1-minute buckets
    buckets[bucket]=(buckets[bucket]||0)+1;
  }
  const entries=Object.entries(buckets);
  if(!entries.length) return null;
  const [topBucket,topCount]=entries.reduce((a,b)=>a[1]>=b[1]?a:b);
  // Require ≥60% of events in one minute to call it a bootstrap cohort
  if(topCount/allRows.length>=0.6) return parseInt(topBucket)*60000;
  return null;
}
let BOOTSTRAP_TS=null;
function isNewRow(r){
  const t=parseIso(r.first_seen_iso);
  if(t<=0 || t<=NEW_CUTOFF_MS) return false;
  if(BOOTSTRAP_TS && Math.abs(t-BOOTSTRAP_TS)<60000) return false;
  return true;
}

function deriveStats(data){
  if(!data) return null;
  const gen=data.general?.rows||[], nk=data.no_kings?.rows||[], pd=data.pride?.rows||[];
  const all=[...gen,...nk,...pd];
  BOOTSTRAP_TS=computeBootstrapTs(all);
  const newCount=all.filter(isNewRow).length;
  const dupCount=all.filter(r=>(r.is_duplicate||'').toLowerCase()==='yes').length;
  const recCount=all.filter(r=>(r.is_recurring||'').toLowerCase()==='yes').length;

  // Event types
  const typeMap={};
  all.forEach(r=>{const t=r.event_type||'Unknown';typeMap[t]=(typeMap[t]||0)+1;});
  const types=Object.entries(typeMap).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);

  // Top properties
  const propMap={};
  all.forEach(r=>{const p=r.property_name||'Unknown';propMap[p]=(propMap[p]||0)+1;});
  const allProps=Object.entries(propMap).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
  const totalPropCount=allProps.length;
  const props=allProps.slice(0,10);

  // Proximity bands
  const bands={red:0,amber:0,green:0};
  gen.forEach(r=>{const d=parseFloat(r.distance_mi)||99;if(d<1)bands.red++;else if(d<2)bands.amber++;else bands.green++;});
  const bandsNK={red:0,amber:0,green:0};
  nk.forEach(r=>{const d=parseFloat(r.distance_mi)||99;if(d<1)bandsNK.red++;else if(d<2)bandsNK.amber++;else bandsNK.green++;});
  const bandsPD={red:0,amber:0,green:0};
  pd.forEach(r=>{const d=parseFloat(r.distance_mi)||99;if(d<1)bandsPD.red++;else if(d<2)bandsPD.amber++;else bandsPD.green++;});

  // Within ½ Mile — highest priority list
  const halfMile=all.filter(r=>(parseFloat(r.distance_mi)||99)<0.5)
    .sort((a,b)=>(parseFloat(a.distance_mi)||99)-(parseFloat(b.distance_mi)||99));

  // Threat level
  const closeCount=all.filter(r=>(parseFloat(r.distance_mi)||99)<0.5).length;
  const threat=closeCount>=5?'critical':closeCount>=3?'high':closeCount>=1?'medium':'low';

  // Map markers
  const markers=[];
  const seen=new Set();
  all.forEach(r=>{
    const lat=parseFloat(r.event_lat),lon=parseFloat(r.event_lon);
    if(!lat||!lon) return;
    const key=`${lat.toFixed(3)},${lon.toFixed(3)}`;
    if(seen.has(key)){
      const m=markers.find(x=>x.key===key);
      if(m) m.count++;
      return;
    }
    seen.add(key);
    const dist=parseFloat(r.distance_mi)||99;
    markers.push({key,lat,lon,name:r.event_title,type:r.event_type,
      threat:dist<1?'critical':dist<2?'high':'low',count:1,dist});
  });

  // Organizers
  const orgMap={};
  const tagStream=(r,src)=>{
    const s=r.sponsor_name;if(!s)return;
    if(!orgMap[s])orgMap[s]={count:0,types:new Set(),streams:{general:0,no_kings:0,pride:0},
      website:'',email:'',phone:'',events:[],closeCount:0,minDist:Infinity};
    const o=orgMap[s];
    o.count++;
    o.streams[src]++;
    if(r.event_type)o.types.add(r.event_type);
    if(!o.website&&r.sponsor_website)o.website=r.sponsor_website;
    if(!o.email&&r.sponsor_email)o.email=r.sponsor_email;
    if(!o.phone&&r.sponsor_phone)o.phone=r.sponsor_phone;
    const d=parseFloat(r.distance_mi);
    if(!isNaN(d)){if(d<o.minDist)o.minDist=d;if(d<1)o.closeCount++;}
    o.events.push(r);
  };
  gen.forEach(r=>tagStream(r,'general'));
  nk.forEach(r=>tagStream(r,'no_kings'));
  pd.forEach(r=>tagStream(r,'pride'));
  const orgs=Object.entries(orgMap).map(([name,v])=>({
    name,count:v.count,
    types:[...v.types].filter(Boolean).slice(0,4),
    typesStr:[...v.types].filter(Boolean).join(', '),
    streams:v.streams,
    website:v.website,email:v.email,phone:v.phone,
    closeCount:v.closeCount,
    minDist:v.minDist===Infinity?null:v.minDist,
    events:v.events.slice().sort((a,b)=>(parseFloat(a.distance_mi)||99)-(parseFloat(b.distance_mi)||99)),
  })).sort((a,b)=>b.count-a.count);

  // Full property profiles (one entry per unique property_name)
  const propProfiles={};
  const tagProp=(r,src)=>{
    const name=r.property_name;if(!name)return;
    if(!propProfiles[name])propProfiles[name]={
      name, lat:parseFloat(r.prop_lat)||null, lon:parseFloat(r.prop_lon)||null,
      events:[], streams:{general:0,no_kings:0,pride:0},
      orgs:new Set(), types:new Set(),
      closeCount:0, halfMileCount:0, minDist:Infinity, recurring:0, newCount:0,
    };
    const p=propProfiles[name];
    p.events.push({...r,_src:src});
    p.streams[src]++;
    if(r.sponsor_name)p.orgs.add(r.sponsor_name);
    if(r.event_type)p.types.add(r.event_type);
    const d=parseFloat(r.distance_mi);
    if(!isNaN(d)){
      if(d<p.minDist)p.minDist=d;
      if(d<1)p.closeCount++;
      if(d<0.5)p.halfMileCount++;
    }
    if((r.is_recurring||'').toLowerCase()==='yes')p.recurring++;
    if(isNewRow(r))p.newCount++;
    if(!p.lat&&parseFloat(r.prop_lat))p.lat=parseFloat(r.prop_lat);
    if(!p.lon&&parseFloat(r.prop_lon))p.lon=parseFloat(r.prop_lon);
  };
  gen.forEach(r=>tagProp(r,'general'));
  nk.forEach(r=>tagProp(r,'no_kings'));
  pd.forEach(r=>tagProp(r,'pride'));
  const properties=Object.values(propProfiles).map(p=>({
    ...p,
    orgs:[...p.orgs],
    types:[...p.types],
    minDist:p.minDist===Infinity?null:p.minDist,
    threat:p.closeCount>=5?'critical':p.closeCount>=3?'high':p.closeCount>=1?'medium':'low',
    events:p.events.sort((a,b)=>(parseFloat(a.distance_mi)||99)-(parseFloat(b.distance_mi)||99)),
  })).sort((a,b)=>b.events.length-a.events.length);

  return {general:gen.length,noKings:nk.length,pride:pd.length,newCount,dupCount,recCount,
    types,props,totalPropCount,bands,bandsNK,bandsPD,threat,closeCount,markers,orgs,halfMile,properties,
    generated:data.generated||'',genSubtitle:data.general?.subtitle||'',
    nkSubtitle:data.no_kings?.subtitle||'',pdSubtitle:data.pride?.subtitle||''};
}

/* ═══ SIDEBAR ══════════════════════════════════════════════════ */
const NAV=[
  {section:'DISCOVER'},
  {id:'dashboard',label:'Summary'},
  {id:'threat',label:'Threat Watch'},
  {id:'events3',label:'General Events'},
  {id:'nogo',label:'No Kings Events'},
  {id:'pride',label:'Pride Month 2026'},
  {section:'ANALYTICS'},
  {id:'map',label:'Map'},
  {id:'timeline',label:'Timeline'},
  {id:'organizers',label:'Organizers'},
  {id:'trends',label:'Trends'},
];

function navBadge(id,stats){
  if(!stats) return null;
  switch(id){
    case 'dashboard':  return null;
    case 'threat':     return stats.halfMile?.length;
    case 'events3':    return stats.general;
    case 'nogo':       return stats.noKings;
    case 'pride':      return stats.pride;
    case 'map':        return stats.markers?.length;
    case 'timeline':   return (stats.general||0)+(stats.noKings||0)+(stats.pride||0);
    case 'organizers': return stats.orgs?.length;
    default:           return null;
  }
}

/* ═══ TOPBAR ═══════════════════════════════════════════════════ */
const LABELS={dashboard:'Summary',threat:'Threat Watch',events3:'General Events',nogo:'No Kings Events',
  pride:'Pride Month 2026',map:'Map',timeline:'Timeline',organizers:'Organizers',trends:'Trends',
  property:'Property'};

function fmtBreadcrumbDate(generatedIso){
  if(!generatedIso) return '';
  try{
    const d=new Date(generatedIso);
    if(isNaN(d)) return '';
    const wkd=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    const hh=String(d.getHours()).padStart(2,'0');
    const mm=String(d.getMinutes()).padStart(2,'0');
    return `${wkd} at ${hh}${mm} ET`;
  }catch{return '';}
}

const TopBar=({t,view,generatedIso,darkMode,handleDark,query,setQuery})=>{
  return <div style={{
    height:54,background:t.bg,borderBottom:`1px solid ${t.border}`,
    display:'flex',alignItems:'center',padding:'0 22px',gap:14,flexShrink:0}}>

    <div style={{display:'flex',alignItems:'baseline',gap:8,minWidth:0}}>
      <span style={{fontSize:14,fontWeight:600,color:t.text,letterSpacing:'-.01em'}}>{LABELS[view]||view}</span>
      <span style={{color:t.textMuted,fontSize:13}}>/</span>
      <span style={{...mono,fontSize:11.5,color:t.textMuted,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
        {fmtBreadcrumbDate(generatedIso)}
      </span>
    </div>
    {/* Search */}
    <div style={{marginLeft:'auto',position:'relative',width:380,maxWidth:'40vw'}}>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={t.textMuted} strokeWidth="2"
        style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}>
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input value={query||''} onChange={e=>setQuery&&setQuery(e.target.value)}

function buildCSV(data){
  const CSV_FIELDS=[
    'event_id','event_title','event_type','event_date','event_url',
    'property_name','distance_mi','address','city','state','zip',
    'sponsor_name','sponsor_email','sponsor_phone','sponsor_website',
    'rsvp_count','is_new','is_duplicate','is_recurring',
    'event_lat','event_lon','first_seen_iso','stream'
  ];
  const escape=v=>{
    if(v==null) return '';
    const s=String(v);
    return s.includes(',')||s.includes('"')||s.includes('\n')?`"${s.replace(/"/g,'""')}"`:s;
  };
  const rows=[
    ...(data?.general?.rows||[]).map(r=>({...r,stream:'general'})),
    ...(data?.no_kings?.rows||[]).map(r=>({...r,stream:'no_kings'})),
    ...(data?.pride?.rows||[]).map(r=>({...r,stream:'pride'})),
  ];
  const header=CSV_FIELDS.join(',');
  const body=rows.map(r=>CSV_FIELDS.map(f=>escape(r[f])).join(',')).join('\n');
  const blob=new Blob([header+'\n'+body],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`protest_tracker_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
}

      {/* Tags */}

        <div style={{...mono,fontSize:9,fontWeight:700,color:t.textMuted,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:6}}>Tags</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {tags.map((tag,i)=><span key={i} style={{...mono,fontSize:10,padding:'3px 8px',borderRadius:2,

        {isNewRow(ev)&&<span style={{...mono,fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:2,background:`${t.low}18`,color:t.low,border:`1px solid ${t.low}35`,textTransform:'uppercase',letterSpacing:'.06em'}}>New · 7 Days</span>}
        {(ev.is_duplicate||'').toLowerCase()==='yes'&&<span style={{...mono,fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:2,background:`${t.high}18`,color:t.high,border:`1px solid ${t.high}35`,textTransform:'uppercase',letterSpacing:'.06em'}}>Near 2+ Properties</span>}

  </div>;

/* ═══ EVENTS TABLE ═════════════════════════════════════════════ */
const EventsTable=({t,rows,type,subtitle,onOpenProperty})=>{
  const [sortCol,setSortCol]=useState('distance_mi');
  const [sortDir,setSortDir]=useState('asc');
  const [search,setSearch]=useState('');
  const [hovered,setHovered]=useState(null);
  const [selected,setSelected]=useState(null);

  const data=useMemo(()=>{
    return (rows||[])
      .filter(r=>{
        if(!search) return true;
        const s=search.toLowerCase();
        return (r.event_title||'').toLowerCase().includes(s)||
          (r.property_name||'').toLowerCase().includes(s)||
          (r.event_location||'').toLowerCase().includes(s)||
          (r.event_type||'').toLowerCase().includes(s);
      })
      .sort((a,b)=>{
        let va=a[sortCol]??'',vb=b[sortCol]??'';
        if(sortCol==='distance_mi'){va=parseFloat(va)||0;vb=parseFloat(vb)||0;}
        else{va=String(va).toLowerCase();vb=String(vb).toLowerCase();}
        if(va<vb) return sortDir==='asc'?-1:1;
        if(va>vb) return sortDir==='asc'?1:-1;
        return 0;
      });
  },[rows,search,sortCol,sortDir]);

  const sort=col=>{if(sortCol===col)setSortDir(d=>d==='asc'?'desc':'asc');else{setSortCol(col);setSortDir('asc');}};

  const TH=({col,children,right})=><th onClick={()=>sort(col)} style={{
    padding:'8px 12px',textAlign:right?'right':'left',fontSize:9,fontWeight:700,letterSpacing:'.1em',
    textTransform:'uppercase',color:sortCol===col?t.accent:t.textMuted,
    borderBottom:`2px solid ${sortCol===col?t.accent:t.border}`,cursor:'pointer',userSelect:'none',
    whiteSpace:'nowrap',background:`${t.border}44`,position:'sticky',top:0,zIndex:2}}>
    <span style={{display:'inline-flex',alignItems:'center',gap:4}}>{children}
      {sortCol===col&&<span style={{fontSize:10}}>{sortDir==='desc'?'↓':'↑'}</span>}
    </span>
  </th>;

  const tdBase={padding:'10px 12px',borderBottom:`1px solid ${t.border}`,verticalAlign:'top',fontSize:12,color:t.text};
  const flagCell=(val)=>{
    const yes=(val||'').toLowerCase()==='yes';
    return <span style={{...mono,fontSize:9,fontWeight:700,color:yes?t.low:t.textMuted,
      background:yes?`${t.low}15`:'transparent',padding:'2px 6px',borderRadius:2}}>{yes?'YES':'—'}</span>;
  };

  return <div style={{padding:22}}>
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
      <div style={{display:'flex',alignItems:'center',gap:8,background:t.surface,border:`1px solid ${t.border}`,
        borderRadius:4,padding:'6px 12px'}}>
        <Icon id="search" size={13} color={t.textMuted}/>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search events, properties…"
          style={{border:'none',outline:'none',fontSize:12,background:'transparent',color:t.text,width:220}}/>
      </div>
    </div>
    <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:4,overflow:'hidden'}}>
      <div style={{overflowX:'auto',maxHeight:'calc(100vh - 220px)',overflowY:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr>
            <TH col="property_name">Property</TH>
            <TH col="event_title">Event</TH>
            <TH col="event_type">Type</TH>
            <TH col="event_date">Date / Time</TH>
            <TH col="event_location">Location</TH>
            <TH col="distance_mi" right>Distance</TH>
            <TH col="is_new">New</TH>
            <TH col="is_duplicate">Dup</TH>
            <TH col="is_recurring">Recur</TH>
          </tr></thead>
          <tbody>
            {data.map((ev,i)=>{
              const dist=parseFloat(ev.distance_mi)||99;
              const bandBg=dist<1?`${t.critical}28`:dist<2?`${t.high}1a`:'transparent';
              const isNew=(ev.is_new||'').toLowerCase()==='yes';
              return <tr key={i}
                onMouseEnter={()=>setHovered(i)} onMouseLeave={()=>setHovered(null)}
                onClick={()=>setSelected(ev)}
                style={{background:hovered===i?`${t.accent}0a`:bandBg,transition:'background .1s',fontWeight:isNew?600:400,cursor:'pointer'}}>
                <td style={{...tdBase,fontWeight:500,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                  <span onClick={e=>{e.stopPropagation();onOpenProperty&&onOpenProperty(ev.property_name);}}
                    style={{cursor:onOpenProperty?'pointer':'default'}}
                    onMouseEnter={e=>{if(onOpenProperty)e.currentTarget.style.color=t.accent;}}
                    onMouseLeave={e=>{if(onOpenProperty)e.currentTarget.style.color='';}}>{ev.property_name}</span>
                </td>
                <td style={{...tdBase,maxWidth:220}}>
                  <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.event_title}</div>
                  {ev.event_url&&<a href={ev.event_url} target="_blank" rel="noopener" style={{fontSize:10,color:t.accent}}>link</a>}
                </td>
                <td style={{...tdBase,fontSize:11}}>{ev.event_type}</td>
                <td style={{...tdBase,...mono,fontSize:10}}>{ev.event_date}</td>
                <td style={{...tdBase,fontSize:11,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.event_location}</td>
                <td style={{...tdBase,...mono,fontWeight:700,textAlign:'right',
                  color:dist<1?t.critical:dist<2?t.high:t.low,fontSize:13}}>{dist.toFixed(2)}</td>
                <td style={tdBase}>{flagCell(ev.is_new)}</td>
                <td style={tdBase}>{flagCell(ev.is_duplicate)}</td>
                <td style={tdBase}>{flagCell(ev.is_recurring)}</td>
              </tr>;
            })}
            {data.length===0&&<tr><td colSpan={9} style={{padding:40,textAlign:'center',color:t.textMuted,fontSize:13}}>
              {search?`No events match "${search}"`:'No events in this window'}</td></tr>}
          </tbody>
        </table>
      </div>
      <div style={{padding:'8px 14px',borderTop:`1px solid ${t.border}`,display:'flex',justifyContent:'space-between',background:`${t.border}33`}}>
        <span style={{...mono,fontSize:10,color:t.textMuted}}>{data.length} records · sorted by {sortCol} · click any row for details</span>
        <span style={{...mono,fontSize:10,color:t.textMuted}}>Distance bands: <span style={{color:t.critical}}>●</span> &lt;1mi <span style={{color:t.high}}>●</span> 1-2mi <span style={{color:t.low}}>●</span> &gt;2mi</span>
      </div>
    </div>
    <EventModal t={t} ev={selected} onClose={()=>setSelected(null)}/>
  </div>;
};

/* ═══ MAP VIEW ═════════════════════════════════════════════════ */
const MapView=({t,markers})=>{
  const mapRef=useRef(null);
  const mapInst=useRef(null);
  const [filter,setFilter]=useState('all');

  useEffect(()=>{
    if(mapInst.current){mapInst.current.remove();mapInst.current=null;}
    if(!mapRef.current||!markers) return;
    const map=L.map(mapRef.current,{zoomControl:false}).setView([38,-96],4);
    L.control.zoom({position:'topleft'}).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
      attribution:'&copy; CARTO',maxZoom:18}).addTo(map);
    const colors={critical:'#dc2626',high:'#ea580c',medium:'#b45309',low:'#15803d'};
    (markers||[]).forEach(m=>{
      if(filter!=='all'&&m.threat!==filter) return;
      const c=colors[m.threat]||'#888';
      const circle=L.circleMarker([m.lat,m.lon],{radius:6+m.count*2,fillColor:c,color:'#fff',
        weight:1.5,fillOpacity:.85,opacity:.9}).addTo(map);
      circle.bindPopup(`<div style="min-width:160px"><b>${m.name}</b><br/><span style="color:#888">${m.type||''}</span><br/><span style="font-size:10px;color:${c};font-weight:700">${m.dist.toFixed(2)} mi</span></div>`);
    });
    mapInst.current=map;
    return ()=>{if(mapInst.current){mapInst.current.remove();mapInst.current=null;}};
  },[filter,markers]);

  const colors={critical:'#dc2626',high:'#ea580c',low:'#15803d'};
  const counts={all:(markers||[]).length};
  ['critical','high','low'].forEach(lv=>{counts[lv]=(markers||[]).filter(m=>m.threat===lv).length;});

  return <div style={{height:'100%',display:'flex',flexDirection:'column'}}>
    <div style={{padding:'8px 16px',display:'flex',alignItems:'center',gap:8,
      borderBottom:`1px solid ${t.border}`,background:t.surface,flexShrink:0}}>
      <span style={{...mono,fontSize:10,color:t.textMuted,letterSpacing:'.08em',marginRight:4}}>FILTER</span>
      {['all','critical','high','low'].map(lv=><button key={lv} onClick={()=>setFilter(lv)} style={{
        ...mono,fontSize:9,fontWeight:600,letterSpacing:'.06em',padding:'4px 10px',borderRadius:3,cursor:'pointer',
        textTransform:'uppercase',transition:'all .12s',
        border:filter===lv?`1px solid ${lv==='all'?t.accent:colors[lv]}`:`1px solid ${t.border}`,
        background:filter===lv?(lv==='all'?t.accentBg:`${colors[lv]}15`):'transparent',
        color:filter===lv?(lv==='all'?t.accent:colors[lv]):t.textMuted}}>
        {lv==='all'?'All':lv==='critical'?'< 1 mi':lv==='high'?'1-2 mi':'> 2 mi'} ({counts[lv]})
      </button>)}
      <span style={{marginLeft:'auto',...mono,fontSize:10,color:t.textMuted}}>
        {counts[filter==='all'?'all':filter]} markers · Dark tiles
      </span>
    </div>
    <div ref={mapRef} style={{flex:1,minHeight:0}}/>
    <div style={{position:'absolute',bottom:16,right:16,zIndex:1000,
      background:'rgba(10,22,40,.92)',borderRadius:6,padding:'10px 14px',border:'1px solid rgba(255,255,255,.1)'}}>
      <div style={{...mono,fontSize:9,color:'#8ca3c0',letterSpacing:'.1em',marginBottom:6}}>DISTANCE</div>
      {[{lv:'critical',label:'< 1 mile'},{lv:'high',label:'1-2 miles'},{lv:'low',label:'> 2 miles'}].map(x=>
        <div key={x.lv} style={{display:'flex',alignItems:'center',gap:8,marginBottom:3}}>
          <div style={{width:10,height:10,borderRadius:'50%',background:colors[x.lv],border:'1.5px solid rgba(255,255,255,.3)'}}/>
          <span style={{...mono,fontSize:10,color:'#c8ddf5'}}>{x.label}</span>
        </div>
      )}
    </div>
  </div>;
};

/* ═══ TIMELINE ═════════════════════════════════════════════════ */
const Timeline=({t,data})=>{
  const [selected,setSelected]=useState(null);
  const STREAM_COLOR={general:t.accent,'no_kings':'#7c3aed',pride:'#ec4899'};
  const STREAM_LABEL={general:'general','no_kings':'no-kings',pride:'pride'};

  const allRows=useMemo(()=>{
    const parseDate=str=>{try{return new Date(str.replace(/\s+EST$/,'').trim());}catch{return new Date(0);}};
    return [
      ...(data?.general?.rows||[]).map(r=>({...r,_src:'general'})),
      ...(data?.no_kings?.rows||[]).map(r=>({...r,_src:'no_kings'})),
      ...(data?.pride?.rows||[]).map(r=>({...r,_src:'pride'})),
    ].sort((a,b)=>parseDate(a.event_date)-parseDate(b.event_date));
  },[data]);

  const groups=useMemo(()=>{
    const dayKey=str=>{try{const d=new Date(str.replace(/\s+EST$/,'').trim());return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}catch{return str||'Unknown';}};
    const out=[];let cur=null;
    for(const row of allRows){
      const k=dayKey(row.event_date);
      if(!cur||cur.key!==k){cur={key:k,rows:[]};out.push(cur);}
      cur.rows.push(row);
    }
    return out;
  },[allRows]);

  if(!allRows.length) return <div style={{padding:60,textAlign:'center',color:t.textMuted,fontSize:13}}>No events loaded.</div>;

  return <div style={{padding:'16px 22px'}}>
    <EventModal t={t} ev={selected} onClose={()=>setSelected(null)}/>
    {groups.map((g,gi)=><div key={gi} style={{marginBottom:8}}>
      {/* Date header */}
      <div style={{display:'flex',alignItems:'center',gap:12,margin:'18px 0 10px',position:'sticky',top:0,background:t.bg,zIndex:2,padding:'4px 0'}}>
        <span style={{...mono,fontSize:11,fontWeight:700,color:t.accent,letterSpacing:'.08em',textTransform:'uppercase',flexShrink:0}}>{g.key}</span>
        <div style={{flex:1,height:1,background:t.border}}/>
        <span style={{...mono,fontSize:10,color:t.textMuted,flexShrink:0}}>{g.rows.length} event{g.rows.length!==1?'s':''}</span>
      </div>
      {/* Event cards */}
      <div style={{paddingLeft:20,borderLeft:`2px solid ${t.border}`,display:'flex',flexDirection:'column',gap:6}}>
        {g.rows.map((ev,i)=>{
          const dist=parseFloat(ev.distance_mi)||99;
          const dc=dist<1?t.critical:dist<2?t.high:t.low;
          const sc=STREAM_COLOR[ev._src]||t.accent;
          const timeMatch=ev.event_date?.match(/\d{1,2}:\d{2}/);
          return <div key={i} onClick={()=>setSelected(ev)}
            style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:4,padding:'9px 14px',
              cursor:'pointer',display:'flex',alignItems:'center',gap:12,position:'relative',
              transition:'border-color .12s'}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=t.borderStrong}
            onMouseLeave={e=>e.currentTarget.style.borderColor=t.border}>
            {/* Dot on the left rail */}
            <div style={{width:9,height:9,borderRadius:'50%',background:sc,flexShrink:0,
              position:'absolute',left:-25,top:'50%',transform:'translateY(-50%)',
              boxShadow:`0 0 0 2px ${t.bg},0 0 0 3px ${sc}55`}}/>
            {/* Time */}
            <span style={{...mono,fontSize:11,color:t.textMuted,flexShrink:0,width:60}}>
              {timeMatch?`${timeMatch[0]} ET`:'—'}
            </span>
            {/* Stream badge */}
            <span style={{...mono,fontSize:9,fontWeight:700,padding:'2px 6px',borderRadius:2,flexShrink:0,
              background:`${sc}18`,color:sc,border:`1px solid ${sc}35`,textTransform:'uppercase',letterSpacing:'.06em'}}>
              {STREAM_LABEL[ev._src]}
            </span>
            {/* Title + property */}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:t.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.event_title}</div>
              <div style={{fontSize:11,color:t.textSub,marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.property_name}</div>
            </div>
            {/* Distance */}
            <span style={{...mono,fontSize:12,fontWeight:700,color:dc,flexShrink:0}}>{dist.toFixed(1)} mi</span>
          </div>;
        })}
      </div>
    </div>)}
  </div>;
};

/* ═══ ORGANIZERS ═══════════════════════════════════════════════ */
const OrganizerModal=({t,org,onClose})=>{
  useEffect(()=>{
    if(!org) return;
    const onKey=e=>{if(e.key==='Escape') onClose();};
    window.addEventListener('keydown',onKey);
    const prev=document.body.style.overflow;
    document.body.style.overflow='hidden';
    return ()=>{window.removeEventListener('keydown',onKey);document.body.style.overflow=prev;};
  },[org,onClose]);
  if(!org) return null;
  const distColor=org.minDist!=null?(org.minDist<1?t.critical:org.minDist<2?t.high:t.low):t.textMuted;
  const websiteHost=org.website?(()=>{try{return new URL(org.website).hostname.replace(/^www\./,'');}catch{return org.website;}})():'';
  return <div onClick={onClose} style={{
    position:'fixed',inset:0,background:'rgba(0,0,0,.62)',backdropFilter:'blur(3px)',
    display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:24}}>
    <div onClick={e=>e.stopPropagation()} style={{
      background:t.surface,border:`1px solid ${t.border}`,borderRadius:6,
      maxWidth:720,width:'100%',maxHeight:'90vh',overflowY:'auto',
      boxShadow:'0 20px 60px rgba(0,0,0,.5)',position:'relative'}}>
      {/* Header */}
      <div style={{padding:'18px 22px 14px',borderBottom:`1px solid ${t.border}`,position:'relative'}}>
        <button onClick={onClose} title="Close (Esc)" style={{
          position:'absolute',top:12,right:12,background:'transparent',
          border:`1px solid ${t.border}`,color:t.textSub,width:28,height:28,
          borderRadius:4,cursor:'pointer',fontSize:16,lineHeight:1,display:'flex',
          alignItems:'center',justifyContent:'center'}}>×</button>
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:6,flexWrap:'wrap'}}>
          <span style={{...mono,fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:2,
            background:`${t.accent}18`,color:t.accent,border:`1px solid ${t.accent}35`,textTransform:'uppercase',letterSpacing:'.06em'}}>Organizer</span>
          <span style={{...mono,fontSize:10,fontWeight:700,padding:'3px 8px',borderRadius:2,
            background:`${t.accent}18`,color:t.accent,border:`1px solid ${t.accent}35`}}>{org.count} event{org.count===1?'':'s'}</span>
          {org.minDist!=null&&<span style={{...mono,fontSize:10,fontWeight:700,padding:'3px 8px',borderRadius:2,
            background:`${distColor}18`,color:distColor,border:`1px solid ${distColor}35`}}>nearest {org.minDist.toFixed(2)} mi</span>}
        </div>
        <h2 style={{fontSize:18,fontWeight:700,color:t.text,marginRight:32,lineHeight:1.3}}>{org.name}</h2>
        {org.typesStr&&<p style={{fontSize:11,color:t.textMuted,marginTop:4}}>{org.typesStr}</p>}
      </div>
      {/* Stats grid */}
      <div style={{padding:'14px 22px',borderBottom:`1px solid ${t.border}`,display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
        {[

                <div style={{fontSize:10,color:t.textMuted,marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.property_name} · {e.event_date||''}</div>

          })}

      </div>
    </div>
  </div>;
};

/* ═══ TRENDS ═══════════════════════════════════════════════════ */
const Trends=({t,data,stats})=>{
  const chartRef=useRef(null);
  const runs=data?.trend_data?.runs||[];

  // ── Stream snapshot data ─────────────────────────────────────
  const streams=[
    {id:'general', label:'General Events',  color:t.accent,    total:stats?.general||0,  bands:stats?.bands||{red:0,amber:0,green:0},  new:(runs[runs.length-1]?.gen_new??null)},
    {id:'no_kings',label:'No Kings',        color:'#7c3aed',   total:stats?.noKings||0,  bands:stats?.bandsNK||{red:0,amber:0,green:0}, new:(runs[runs.length-1]?.nk_new??null)},
    {id:'pride',   label:'Pride Month',     color:'#ec4899',   total:stats?.pride||0,    bands:stats?.bandsPD||{red:0,amber:0,green:0}, new:(runs[runs.length-1]?.pd_new??null)},
  ];

  // ── Event type distribution ──────────────────────────────────
  const types=stats?.types||[];
  const maxType=Math.max(...types.map(x=>x.count),1);

  // ── Historical chart ─────────────────────────────────────────
  const isDarkBg=(()=>{const b=t.bg||'#fff';const m=b.match(/[0-9a-f]{2}/gi);if(!m)return false;const [r,g,bl]=m.map(x=>parseInt(x,16));return (r+g+bl)/3<128;})();
  const gridColor=isDarkBg?'rgba(255,255,255,.07)':'rgba(0,0,0,.07)';
  const showChart=runs.length>=1;
  const useBar=runs.length<2;

  useEffect(()=>{
    if(!chartRef.current||!showChart) return;
    const labels=runs.map(r=>r.label||(r.ts?new Date(r.ts).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'')||'');
    const baseDataset=(label,data,color)=>useBar
      ? {label,data,backgroundColor:`${color}cc`,borderColor:color,borderWidth:1,borderRadius:4}
      : {label,data,borderColor:color,backgroundColor:`${color}18`,tension:.35,fill:true,pointRadius:3,pointHoverRadius:5,borderWidth:2};
    const chart=new Chart(chartRef.current,{
      type:useBar?'bar':'line',
      data:{labels,datasets:[
        baseDataset('General',  runs.map(r=>r.gen_total??0),t.accent),
        baseDataset('No Kings', runs.map(r=>r.nk_total??0),'#7c3aed'),
        baseDataset('Pride',    runs.map(r=>r.pd_total??0),'#ec4899'),
      ]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{labels:{color:t.text,font:{family:"'Inter'",size:11},boxWidth:12,padding:16}},
          tooltip:{backgroundColor:t.surface,borderColor:t.border,borderWidth:1,titleColor:t.text,bodyColor:t.textSub,padding:10,
            callbacks:{title:items=>items[0]?.label||''}},
        },
        scales:{
          x:{ticks:{color:t.textMuted,font:{size:10},maxTicksLimit:14},grid:{color:gridColor},border:{color:t.border}},
          y:{beginAtZero:true,ticks:{color:t.textMuted,font:{size:10}},grid:{color:gridColor},border:{color:t.border}},
        },
      },
    });
    return ()=>chart.destroy();
  },[runs,t,showChart,useBar]);

  const sectionHead=(label,sub)=><div style={{marginBottom:14}}>
    <div style={{...mono,fontSize:10,fontWeight:700,letterSpacing:'.14em',textTransform:'uppercase',color:t.textMuted}}>{label}</div>
    {sub&&<div style={{fontSize:11,color:t.textMuted,marginTop:2}}>{sub}</div>}
  </div>;

  const ProxBar=({bands,color})=>{
    const tot=(bands.red||0)+(bands.amber||0)+(bands.green||0)||1;
    return <div style={{display:'flex',flexDirection:'column',gap:4,marginTop:8}}>
      {[{k:'red',c:t.critical,label:'< 1 mi'},{k:'amber',c:t.high,label:'1–2 mi'},{k:'green',c:t.low,label:'> 2 mi'}].map(({k,c,label})=>{
        const v=bands[k]||0;
        const pct=Math.round(v/tot*100);
        return <div key={k} style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{...mono,fontSize:9,color:c,width:36,flexShrink:0,fontWeight:700}}>{label}</div>
          <div style={{flex:1,height:6,borderRadius:3,background:t.border,overflow:'hidden'}}>
            <div style={{width:`${pct}%`,height:'100%',borderRadius:3,background:c,transition:'width .4s ease'}}/>
          </div>
          <div style={{...mono,fontSize:10,color:t.textSub,width:28,textAlign:'right'}}>{v}</div>
        </div>;
      })}
    </div>;
  };

  return <div style={{padding:24,display:'flex',flexDirection:'column',gap:24}}>

    {/* ── Section 1: Stream snapshot ─────────────────────────── */}
    <div>
      {sectionHead('Current Snapshot','Live totals and proximity breakdown per stream')}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14}}>
        {streams.map(s=>{
          const tot=(s.bands.red||0)+(s.bands.amber||0)+(s.bands.green||0)||1;
          return <div key={s.id} style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:18}}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8,marginBottom:4}}>
              <div>
                <div style={{...mono,fontSize:9,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:t.textMuted,marginBottom:4}}>{s.label}</div>
                <div style={{...mono,fontSize:36,fontWeight:700,color:s.color,lineHeight:1}}>{s.total}</div>
                <div style={{fontSize:11,color:t.textMuted,marginTop:4}}>events</div>
              </div>
              <div style={{textAlign:'right'}}>
                {s.new!=null&&<div style={{...mono,fontSize:11,color:t.low,fontWeight:700,marginBottom:2}}>+{s.new} new</div>}
                <div style={{...mono,fontSize:10,color:t.critical,fontWeight:700}}>{s.bands.red||0} within 1 mi</div>
              </div>
            </div>
            <div style={{borderTop:`1px solid ${t.border}`,paddingTop:10,marginTop:10}}>
              <div style={{...mono,fontSize:9,color:t.textMuted,letterSpacing:'.08em',marginBottom:6}}>PROXIMITY BREAKDOWN</div>
              <ProxBar bands={s.bands} color={s.color}/>
            </div>
          </div>;
        })}
      </div>
    </div>

    {/* ── Section 2: Event type distribution ────────────────── */}
    {types.length>0&&<div>
      {sectionHead('Event Type Distribution','All streams combined · sorted by volume')}
      <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:18,display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px 32px'}}>
        {types.slice(0,20).map((tp,i)=><div key={tp.name} style={{display:'flex',alignItems:'center',gap:10,padding:'5px 0',
          borderBottom:i<Math.min(types.length,20)-2?`1px solid ${t.border}`:'none'}}>
          <div style={{...mono,fontSize:9,color:t.textMuted,width:16,textAlign:'right',flexShrink:0}}>{i+1}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:11,fontWeight:500,color:t.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:3}}>{tp.name}</div>
            <div style={{height:5,borderRadius:3,background:t.border,overflow:'hidden'}}>
              <div style={{width:`${(tp.count/maxType)*100}%`,height:'100%',borderRadius:3,
                background:i===0?t.accent:i===1?'#7c3aed':i===2?'#ec4899':t.borderStrong,transition:'width .4s ease'}}/>
            </div>
          </div>
          <div style={{...mono,fontSize:11,fontWeight:700,color:t.textSub,width:28,textAlign:'right',flexShrink:0}}>{tp.count}</div>
        </div>)}
      </div>
    </div>}

    {/* ── Section 3: Historical trend chart ─────────────────── */}
    <div>
      {sectionHead('Historical Volume',runs.length<2?'First run captured — line chart unlocks after the next scheduled run':'Event counts per scheduled run over time')}
      {showChart
        ? <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:20,height:340,position:'relative'}}>
            <canvas ref={chartRef}/>
            {runs.length<2&&<div style={{position:'absolute',top:12,right:14,...mono,fontSize:9,color:t.textMuted,letterSpacing:'.08em',textTransform:'uppercase'}}>Building history… {runs.length}/5 runs</div>}
          </div>
        : <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:32,textAlign:'center'}}>
            <div style={{fontSize:13,color:t.textMuted}}>No run data yet — check back after the workflow executes.</div>
          </div>
      }
    </div>

  </div>;
};

/* ═══ THREAT WATCH ═════════════════════════════════════════════ */
const ThreatWatch=({t,stats,onOpenProperty})=>{
  const [selected,setSelected]=useState(null);
  const events=useMemo(()=>{
    const all=(stats?.halfMile||[]).slice();
    const parseDt=str=>{try{return new Date((str||'').replace(/\s+EST$/,'').trim()).getTime()||0;}catch{return 0;}};
    return all.sort((a,b)=>{
      const da=parseFloat(a.distance_mi)||99, db=parseFloat(b.distance_mi)||99;
      if(Math.abs(da-db)>0.05) return da-db;
      return parseDt(a.event_date)-parseDt(b.event_date);
    });
  },[stats]);
  // Group by property
  const grouped=useMemo(()=>{
    const map={};
    events.forEach(e=>{const k=e.property_name||'Unknown';if(!map[k])map[k]=[];map[k].push(e);});
    return Object.entries(map).map(([name,evs])=>({
      name, events:evs,
      minDist:Math.min(...evs.map(x=>parseFloat(x.distance_mi)||99)),
    })).sort((a,b)=>a.minDist-b.minDist);
  },[events]);

  if(!events.length) return <div style={{padding:40,textAlign:'center',color:t.textMuted}}>
    <div style={{...mono,fontSize:11,letterSpacing:'.1em',color:t.low,marginBottom:8}}>● ALL CLEAR</div>
    <div style={{fontSize:13,color:t.text,marginBottom:4}}>No events within ½ mile of any tracked property</div>
    <div style={{fontSize:11,color:t.textMuted}}>Threat Watch surfaces events when they fall inside the half-mile danger zone.</div>
  </div>;

  return <div style={{padding:24}}>
    <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:16,marginBottom:14,flexWrap:'wrap',
      paddingBottom:14,borderBottom:`1px solid ${t.border}`}}>
      <div>
        <div style={{...mono,fontSize:10,fontWeight:700,letterSpacing:'.18em',color:t.critical,marginBottom:6}}>● ACTIVE THREAT WATCH</div>
        <h1 style={{fontSize:30,fontWeight:700,color:t.text,letterSpacing:'-.02em',lineHeight:1.05}}>
          <span style={{color:t.critical}}>{events.length}</span> event{events.length===1?'':'s'} within ½ mile
        </h1>
        <div style={{fontSize:12,color:t.textMuted,marginTop:6}}>across {grouped.length} {grouped.length===1?'property':'properties'} · sorted by proximity</div>
      </div>
    </div>

    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      {grouped.map(g=>{
        const tot=g.events.length;
        const dc=g.minDist<0.25?t.critical:t.high;
        return <div key={g.name} style={{background:t.surface,border:`1px solid ${t.border}`,borderLeft:`3px solid ${dc}`,borderRadius:6}}>
          <div style={{padding:'12px 16px',borderBottom:`1px solid ${t.border}`,display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
            <div style={{minWidth:0,flex:1}}>
              <div onClick={()=>onOpenProperty&&onOpenProperty(g.name)}
                style={{fontSize:14,fontWeight:600,color:t.text,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6}}
                onMouseEnter={e=>e.currentTarget.style.color=t.accent}
                onMouseLeave={e=>e.currentTarget.style.color=t.text}>
                {g.name}
                <span style={{fontSize:10,opacity:.7}}>↗</span>
              </div>
              <div style={{...mono,fontSize:10,color:t.textMuted,marginTop:2}}>
                {tot} event{tot===1?'':'s'} · nearest {g.minDist.toFixed(2)} mi
              </div>
            </div>
            <span style={{...mono,fontSize:10,fontWeight:700,padding:'4px 10px',borderRadius:3,
              background:`${dc}18`,color:dc,border:`1px solid ${dc}35`,textTransform:'uppercase',letterSpacing:'.06em'}}>
              {g.minDist<0.25?'critical':'high'}
            </span>
          </div>
          <div>{g.events.map((ev,i)=>{
            const d=parseFloat(ev.distance_mi)||99;
            const evDc=d<0.25?t.critical:t.high;
            return <div key={i} onClick={()=>setSelected(ev)} style={{display:'flex',alignItems:'center',gap:12,
              padding:'10px 16px',cursor:'pointer',transition:'background .1s',
              borderBottom:i<g.events.length-1?`1px solid ${t.border}`:'none'}}
              onMouseEnter={e=>e.currentTarget.style.background=`${t.accent}09`}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <span style={{...mono,fontSize:12,fontWeight:700,color:evDc,width:54,flexShrink:0}}>{d.toFixed(2)}mi</span>
              <span style={{...mono,fontSize:9,fontWeight:600,padding:'2px 7px',borderRadius:2,flexShrink:0,
                background:t.bg,color:t.textSub,border:`1px solid ${t.border}`,textTransform:'uppercase',letterSpacing:'.04em'}}>{ev.event_type||'EVENT'}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:500,color:t.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.event_title||'Untitled'}</div>
                <div style={{fontSize:10,color:t.textMuted,marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.sponsor_name||'—'}</div>
              </div>
              <span style={{...mono,fontSize:11,fontWeight:600,color:t.textSub,flexShrink:0,whiteSpace:'nowrap'}}>{ev.event_date}</span>
            </div>;
          })}</div>
        </div>;
      })}
    </div>
    <EventModal t={t} ev={selected} onClose={()=>setSelected(null)}/>
  </div>;
};

/* ═══ PROPERTY DETAIL ══════════════════════════════════════════ */
const PropertyView=({t,name,stats,onBack,onOpenProperty})=>{
  const [selected,setSelected]=useState(null);
  const mapRef=useRef(null);
  const mapInst=useRef(null);
  const prop=useMemo(()=>(stats?.properties||[]).find(p=>p.name===name),[stats,name]);

  useEffect(()=>{
    if(mapInst.current){mapInst.current.remove();mapInst.current=null;}
    if(!mapRef.current||!prop||!prop.lat||!prop.lon) return;
    const map=L.map(mapRef.current,{zoomControl:true,scrollWheelZoom:false}).setView([prop.lat,prop.lon],14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; CARTO',maxZoom:18}).addTo(map);
    L.circleMarker([prop.lat,prop.lon],{radius:8,fillColor:'#ffffff',color:'#000',weight:2,fillOpacity:1,opacity:1})
      .addTo(map).bindPopup(`<b>${prop.name}</b>`);
    L.circle([prop.lat,prop.lon],{radius:805,color:t.critical,fillColor:t.critical,fillOpacity:.04,weight:1,dashArray:'4,4'}).addTo(map);
    L.circle([prop.lat,prop.lon],{radius:1609,color:t.high,fillColor:t.high,fillOpacity:.03,weight:1,dashArray:'4,4'}).addTo(map);
    L.circle([prop.lat,prop.lon],{radius:3219,color:t.low,fillColor:t.low,fillOpacity:.02,weight:1,dashArray:'4,4'}).addTo(map);
    prop.events.forEach(ev=>{
      const lat=parseFloat(ev.event_lat),lon=parseFloat(ev.event_lon);
      if(!lat||!lon) return;
      const d=parseFloat(ev.distance_mi)||99;
      const c=d<1?t.critical:d<2?t.high:t.low;
      L.circleMarker([lat,lon],{radius:5,fillColor:c,color:'#fff',weight:1,fillOpacity:.85})
        .addTo(map).bindPopup(`<div style="min-width:140px"><b>${ev.event_title}</b><br/><span style="color:#888">${ev.event_type||''}</span><br/><span style="font-size:10px;color:${c};font-weight:700">${d.toFixed(2)} mi</span></div>`);
    });
    mapInst.current=map;
    return ()=>{if(mapInst.current){mapInst.current.remove();mapInst.current=null;}};
  },[prop,t]);

  if(!prop) return <div style={{padding:40,textAlign:'center',color:t.textMuted}}>
    <div style={{fontSize:14,color:t.text,marginBottom:8}}>Property "{name}" not found</div>
    <button onClick={onBack} style={{...mono,fontSize:11,padding:'6px 14px',borderRadius:4,background:'transparent',
      border:`1px solid ${t.border}`,color:t.accent,cursor:'pointer'}}>← Back</button>
  </div>;

  const threatColors={critical:t.critical,high:t.high,medium:t.high,low:t.low};
  const threatColor=threatColors[prop.threat]||t.textMuted;
  // Top organizers active near this property
  const orgCounts={};
  prop.events.forEach(e=>{if(e.sponsor_name)orgCounts[e.sponsor_name]=(orgCounts[e.sponsor_name]||0)+1;});
  const topOrgs=Object.entries(orgCounts).map(([n,c])=>({name:n,count:c})).sort((a,b)=>b.count-a.count).slice(0,8);

  return <div style={{padding:24,display:'flex',flexDirection:'column',gap:16}}>
    {/* Back link */}
    <div>
      <button onClick={onBack} style={{...mono,fontSize:10,padding:'4px 10px',borderRadius:4,background:'transparent',
        border:`1px solid ${t.border}`,color:t.textSub,cursor:'pointer',letterSpacing:'.06em'}}>← Back</button>
    </div>

    {/* Header */}
    <div style={{paddingBottom:14,borderBottom:`1px solid ${t.border}`,display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:16,flexWrap:'wrap'}}>
      <div style={{minWidth:0}}>
        <div style={{...mono,fontSize:10,fontWeight:700,letterSpacing:'.18em',color:t.textMuted,marginBottom:6}}>PROPERTY PROFILE</div>
        <h1 style={{fontSize:28,fontWeight:700,color:t.text,letterSpacing:'-.02em',lineHeight:1.1}}>{prop.name}</h1>
        {prop.lat&&prop.lon&&<div style={{...mono,fontSize:11,color:t.textMuted,marginTop:6}}>{prop.lat.toFixed(4)}, {prop.lon.toFixed(4)}</div>}
      </div>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <span style={{...mono,fontSize:10,fontWeight:700,padding:'4px 10px',borderRadius:3,
          background:`${threatColor}18`,color:threatColor,border:`1px solid ${threatColor}35`,textTransform:'uppercase',letterSpacing:'.06em'}}>
          {prop.threat} threat
        </span>
      </div>
    </div>

    {/* Stat cards */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:12}}>
      {[
        {label:'Total Events',v:prop.events.length,c:t.accent},
        {label:'Within ½ mi',v:prop.halfMileCount,c:t.critical},
        {label:'Within 1 mi',v:prop.closeCount,c:t.high},
        {label:'Organizers',v:prop.orgs.length,c:t.text},
        {label:'Recurring',v:prop.recurring,c:'#7c3aed'},
      ].map(s=><div key={s.label} style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:14}}>
        <div style={{...mono,fontSize:9,fontWeight:700,letterSpacing:'.1em',color:t.textMuted,textTransform:'uppercase',marginBottom:6}}>{s.label}</div>
        <div style={{...mono,fontSize:32,fontWeight:700,color:s.v?s.c:t.textMuted,lineHeight:1}}>{s.v}</div>
      </div>)}
    </div>

    {/* Two-col: Map + Top Organizers */}
    <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:14}}>
      <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,overflow:'hidden'}}>
        <div style={{padding:'10px 14px',borderBottom:`1px solid ${t.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{...mono,fontSize:10,fontWeight:700,letterSpacing:'.12em',color:t.textMuted,textTransform:'uppercase'}}>Local Map</div>
          <div style={{...mono,fontSize:9,color:t.textMuted}}>
            <span style={{color:t.critical}}>● ½ mi</span> · <span style={{color:t.high}}>● 1 mi</span> · <span style={{color:t.low}}>● 2 mi</span>
          </div>
        </div>
        <div ref={mapRef} style={{height:340,background:t.bg}}/>
      </div>
      <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,padding:14}}>
        <div style={{...mono,fontSize:10,fontWeight:700,letterSpacing:'.12em',color:t.textMuted,textTransform:'uppercase',marginBottom:10}}>Top Organizers</div>
        {topOrgs.length===0&&<div style={{fontSize:11,color:t.textMuted}}>No sponsor data</div>}
        {topOrgs.map(o=><div key={o.name} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,padding:'6px 0',borderBottom:`1px solid ${t.border}`}}>
          <div style={{fontSize:11,color:t.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1,minWidth:0}}>{o.name}</div>
          <div style={{...mono,fontSize:11,fontWeight:700,color:t.accent,flexShrink:0}}>{o.count}</div>
        </div>)}
      </div>
    </div>

    {/* Event list */}
    <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:8,overflow:'hidden'}}>
      <div style={{padding:'10px 14px',borderBottom:`1px solid ${t.border}`,...mono,fontSize:10,fontWeight:700,letterSpacing:'.12em',color:t.textMuted,textTransform:'uppercase',display:'flex',justifyContent:'space-between'}}>
        <span>All Events Near {prop.name}</span>
        <span style={{color:t.textSub}}>{prop.events.length} total · sorted by distance</span>
      </div>
      {prop.events.map((ev,i)=>{
        const d=parseFloat(ev.distance_mi)||99;
        const c=d<1?t.critical:d<2?t.high:t.low;
        const src=ev._src||'general';
        const srcColor=src==='general'?t.accent:src==='no_kings'?'#7c3aed':'#ec4899';
        const srcLabel=src==='general'?'GEN':src==='no_kings'?'NK':'PD';
        return <div key={i} onClick={()=>setSelected(ev)} style={{display:'flex',alignItems:'center',gap:12,
          padding:'10px 14px',cursor:'pointer',transition:'background .1s',
          borderBottom:i<prop.events.length-1?`1px solid ${t.border}`:'none'}}
          onMouseEnter={e=>e.currentTarget.style.background=`${t.accent}09`}
          onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
          <span style={{...mono,fontSize:11,fontWeight:700,color:c,width:50,flexShrink:0}}>{d.toFixed(2)}mi</span>
          <span style={{...mono,fontSize:8,fontWeight:700,padding:'2px 6px',borderRadius:2,flexShrink:0,
            background:`${srcColor}18`,color:srcColor,border:`1px solid ${srcColor}30`}}>{srcLabel}</span>
          <span style={{...mono,fontSize:9,fontWeight:600,padding:'2px 7px',borderRadius:2,flexShrink:0,
            background:t.bg,color:t.textSub,border:`1px solid ${t.border}`,textTransform:'uppercase',letterSpacing:'.04em'}}>{ev.event_type||'EVENT'}</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:12,fontWeight:500,color:t.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.event_title||'Untitled'}</div>
            <div style={{fontSize:10,color:t.textMuted,marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ev.sponsor_name||'—'}</div>
          </div>
          <span style={{...mono,fontSize:11,fontWeight:600,color:t.textSub,flexShrink:0,whiteSpace:'nowrap'}}>{ev.event_date}</span>
        </div>;
      })}
    </div>

    <EventModal t={t} ev={selected} onClose={()=>setSelected(null)}/>
  </div>;
};

/* ═══ APP ══════════════════════════════════════════════════════ */
const App=()=>{
  const saved=(()=>{try{return JSON.parse(localStorage.getItem('pt2_state')||'{}')}catch{return{}}})();
  const [view,setView]=useState(saved.view||'dashboard');
  const [prevView,setPrevView]=useState('dashboard');
  const [selectedProperty,setSelectedProperty]=useState(null);
  const [darkMode,setDarkMode]=useState(saved.dark!=='0');
  const [query,setQuery]=useState('');
  const variant=darkMode?'midnight':'daylight';
  const t=THEMES[variant];

  const {data,err}=useData();
  const stats=useMemo(()=>deriveStats(data),[data]);

  const persist=(k,v)=>{const s=JSON.parse(localStorage.getItem('pt2_state')||'{}');s[k]=v;localStorage.setItem('pt2_state',JSON.stringify(s));};
  const handleView=v=>{setView(v);persist('view',v);};
  const handleDark=()=>{const nv=!darkMode;setDarkMode(nv);persist('dark',nv?'1':'0');};
  const openProperty=name=>{setPrevView(view);setSelectedProperty(name);setView('property');};
  const closeProperty=()=>{setView(prevView||'dashboard');setSelectedProperty(null);};

  if(err) return <div style={{padding:60,textAlign:'center',fontFamily:'Inter,sans-serif',color:'#666'}}>
    <h2 style={{marginBottom:12}}>Could not load dashboard_data.json</h2>
    <p>Make sure <code>dashboard_data.json</code> is in the same folder as this file.</p>
    <p style={{marginTop:8,fontSize:12,color:'#999'}}>Error: {err}</p>
    <a href="classic.html" style={{display:'inline-block',marginTop:16,color:'#a3e635'}}>← Switch to Classic Dashboard</a>
  </div>;

  return <div style={{display:'flex',height:'100vh',overflow:'hidden',background:t.bg}}>
    <Sidebar t={t} view={view} setView={handleView} stats={stats} version="v2.5"/>
    <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
      <TopBar t={t} view={view} generatedIso={data?.generated_iso}
        darkMode={darkMode} handleDark={handleDark} query={query} setQuery={setQuery}/>
      <div style={{flex:1,overflowY:'auto',position:'relative'}}>
        {view==='dashboard'&&<Dashboard t={t} stats={stats} data={data} onOpenProperty={openProperty} onGoThreat={()=>handleView('threat')}/>}
        {view==='threat'&&<ThreatWatch t={t} stats={stats} onOpenProperty={openProperty}/>}
        {view==='events3'&&<EventsTable t={t} rows={data?.general?.rows} type="3day" subtitle={stats?.genSubtitle||''} onOpenProperty={openProperty}/>}
        {view==='nogo'&&<EventsTable t={t} rows={data?.no_kings?.rows} type="nogo" subtitle={stats?.nkSubtitle||''} onOpenProperty={openProperty}/>}
        {view==='pride'&&<EventsTable t={t} rows={data?.pride?.rows} type="pride" subtitle={stats?.pdSubtitle||''} onOpenProperty={openProperty}/>}
        {view==='map'&&<MapView t={t} markers={stats?.markers}/>}
        {view==='timeline'&&<Timeline t={t} data={data}/>}
        {view==='organizers'&&<Organizers t={t} orgs={stats?.orgs}/>}
        {view==='trends'&&<Trends t={t} data={data} stats={stats}/>}
        {view==='property'&&<PropertyView t={t} name={selectedProperty} stats={stats} onBack={closeProperty} onOpenProperty={openProperty}/>}
      </div>
    </div>
  </div>;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
