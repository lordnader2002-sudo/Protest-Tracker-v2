name: Protest Tracker

on:
  # Run 3× daily at 7 AM, 3 PM, and 11 PM ET
  # Cron uses UTC. Currently EDT (UTC-4): 11:00, 19:00, 03:00 UTC
  # Shifts to EST (UTC-5) in winter:      12:00, 20:00, 04:00 UTC
  schedule:
    - cron: "0 3,11,19 * * *"

  # Manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "full"
        type: choice
        options:
          - full        # query Mobilize API and build report
          - regen       # rebuild Excel from last cached data (instant)

jobs:
  run-tracker:
    name: ${{ github.event.inputs.mode == 'regen' && 'Regen Excel from Cache' || 'Fetch Events & Generate Report' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests openpyxl tqdm zipcodes

      # ── Regen path: download the latest saved cache ────────────────────────
      - name: Download latest data cache (regen only)
        if: github.event.inputs.mode == 'regen'
        id: download-cache
        uses: dawidd6/action-download-artifact@v21
        with:
          name: protest-tracker-cache
          workflow: protest_tracker.yml
          workflow_conclusion: success
          if_no_artifact_found: warn

      - name: Abort if no cache exists yet
        if: github.event.inputs.mode == 'regen' && steps.download-cache.outputs.found_artifact == 'false'
        run: |
          echo "::error::No cache artifact found. Run the workflow once in 'full' mode first to create it, then use 'regen'."
          exit 1

      - name: Regen Excel from cache
        if: github.event.inputs.mode == 'regen'
        run: |
          python3 protest_tracker.py \
            --regen \
            --output "protest_tracker_$(date +'%Y-%m-%d').xlsx"

      # ── Full run path ──────────────────────────────────────────────────────
      - name: Download previous cache for new-event detection (full run)
        if: github.event.inputs.mode != 'regen'
        uses: dawidd6/action-download-artifact@v21
        with:
          name: protest-tracker-cache
          workflow: protest_tracker.yml
          workflow_conclusion: success
          if_no_artifact_found: warn

      - name: Fetch previous dashboard, ledger, and runs log
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Previous dashboard: from the private Supabase bucket once configured
          # (real-lock mode); otherwise fall back to the public gh-pages copy.
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            curl -fsS "${SUPABASE_URL}/storage/v1/object/dashboard/dashboard_data.json" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -o dashboard_data_prev.json \
              && echo "  Loaded previous dashboard_data.json from Supabase ($(wc -c < dashboard_data_prev.json) bytes)" \
              || echo "  No previous dashboard in Supabase — all events will be treated as new"
          else
            git fetch origin gh-pages --depth=1 2>/dev/null || true
            git show origin/gh-pages:dashboard_data.json > dashboard_data_prev.json 2>/dev/null \
              && echo "  Loaded previous dashboard_data.json from gh-pages ($(wc -c < dashboard_data_prev.json) bytes)" \
              || echo "  No previous gh-pages dashboard found — all events will be treated as new"
          fi
          # Ledger + runs log stay on gh-pages (IDs/counts only, no event details)
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git show origin/gh-pages:first_seen_ledger.json > first_seen_ledger.json 2>/dev/null \
            && echo "  Loaded first_seen_ledger.json ($(wc -c < first_seen_ledger.json) bytes)" \
            || echo "  No previous ledger found — starting fresh"
          git show origin/gh-pages:runs_log.jsonl > runs_log.jsonl 2>/dev/null \
            && echo "  Loaded runs_log.jsonl ($(wc -l < runs_log.jsonl) entries)" \
            || echo "  No previous runs log found — starting fresh"

      - name: Run Protest Tracker (full)
        if: github.event.inputs.mode != 'regen'
        env:
          MOBILIZE_API_KEY: ${{ secrets.MOBILIZE_API_KEY }}
        run: |
          python3 protest_tracker.py \
            --output "protest_tracker_$(date +'%Y-%m-%d').xlsx"

      - name: Save data cache artifact (full run only)
        if: github.event.inputs.mode != 'regen'
        uses: actions/upload-artifact@v6
        with:
          name: protest-tracker-cache
          path: protest_tracker_cache.json
          retention-days: 30
          overwrite: true

      # ── Always upload the Excel report ────────────────────────────────────
      - name: Upload report as artifact
        uses: actions/upload-artifact@v6
        with:
          name: "protest-tracker-report-${{ github.run_id }}"
          path: "protest_tracker_*.xlsx"
          retention-days: 30

      # ── Upload event data + report to the PRIVATE Supabase bucket ─────────
      # (real-lock mode). The data never touches the public gh-pages branch.
      - name: Upload data to Supabase (full run)
        if: github.event.inputs.mode != 'regen'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "  Supabase secrets not set — skipping upload (data will publish publicly as fallback)."
            exit 0
          fi
          cp protest_tracker_*.xlsx protest_tracker_latest.xlsx 2>/dev/null || true
          echo "  Uploading dashboard_data.json to private bucket …"
          curl -fsS -X POST "${SUPABASE_URL}/storage/v1/object/dashboard/dashboard_data.json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "x-upsert: true" -H "Content-Type: application/json" \
            --data-binary @dashboard_data.json >/dev/null
          if [ -f protest_tracker_latest.xlsx ]; then
            echo "  Uploading protest_tracker_latest.xlsx to private bucket …"
            curl -fsS -X POST "${SUPABASE_URL}/storage/v1/object/dashboard/protest_tracker_latest.xlsx" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "x-upsert: true" \
              -H "Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" \
              --data-binary @protest_tracker_latest.xlsx >/dev/null
          fi
          echo "  ✓ Supabase upload complete."

      # ── Deploy dashboard to GitHub Pages ──────────────────────────────────
      - name: Stage Pages assets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          mkdir -p _site
          # v2 dashboard (code only — not sensitive) is served as the root index.html
          cp dashboard_v2.html _site/index.html
          # Event data + Excel are published publicly ONLY when Supabase isn't
          # configured yet (fallback). Once secrets are set they live in the
          # private bucket and never reach the public gh-pages branch.
          if [ -z "$SUPABASE_URL" ]; then
            cp dashboard_data.json _site/
            cp protest_tracker_*.xlsx _site/protest_tracker_latest.xlsx 2>/dev/null || true
          fi
          # Durable first_seen ledger and append-only run history (IDs/counts only)
          cp first_seen_ledger.json _site/ 2>/dev/null || true
          cp runs_log.jsonl _site/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            gh-pages
